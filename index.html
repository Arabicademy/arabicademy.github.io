<style>
  /* The first-paint screen. It repeats a little of the app's styling on
     purpose: this markup has to stand on its own before any stylesheet the
     application injects exists. */
  @font-face { font-family: 'HeeboBoot'; src: local('Heebo'); }
  body { margin: 0; background: #00223B; }
  .zl-boot {
    position: fixed; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 22px; padding: 28px; text-align: center;
    font-family: 'Heebo', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background:
      radial-gradient(120% 90% at 50% 0%, rgba(46,124,184,0.32) 0%, rgba(0,34,59,0) 62%),
      linear-gradient(165deg, #013A61 0%, #00223B 55%, #00121F 100%);
  }
  @keyframes zl-boot-rise { from { opacity:0; transform:translateY(12px) scale(0.97);} to { opacity:1; transform:none;} }
  .zl-boot-logo { width: min(230px, 62vw); animation: zl-boot-rise .5s ease both; }
  .zl-boot-rule { width: 70px; height: 3px; background: #E6282A; border-radius: 2px; animation: zl-boot-rise .5s ease .12s both; }
  .zl-boot-hi {
    font-size: clamp(1.5rem, 6vw, 2.1rem); font-weight: 800; color: #fff;
    line-height: 1.5; margin: 0; animation: zl-boot-rise .5s ease .2s both;
  }
  .zl-boot-note { font-size: 0.8rem; color: rgba(255,255,255,0.62); margin: 0; animation: zl-boot-rise .5s ease .28s both; }
  @media (prefers-reduced-motion: reduce) {
    .zl-boot-logo, .zl-boot-rule, .zl-boot-hi, .zl-boot-note { animation: none; }
  }

  #boot-error {
    display: none;
    direction: ltr;
    text-align: left;
    font-family: monospace;
    white-space: pre-wrap;
    word-break: break-all;
    overflow-wrap: anywhere;
    background: #fee2e2;
    color: #7f1d1d;
    border: 2px solid #dc2626;
    padding: 16px;
    margin: 16px;
    border-radius: 8px;
    font-size: 13px;
    line-height: 1.5;
  }
</style>
</head>

<script>
  function showBootError(title, err) {
    var box = document.getElementById('boot-error');
    box.style.display = 'block';
    var name = (err && err.name) ? err.name : 'Error';
    var message = (err && err.message) ? err.message : String(err);
    var stack = (err && err.stack) ? err.stack : '';
    box.textContent =
      title + '\n\n' +
      name + ': ' + message + '\n\n' +
      '--- stack ---\n' + stack;
  }
  window.addEventListener('error', function (e) {
    showBootError('שגיאת JavaScript:', e.error || e.message);
  });
  window.addEventListener('unhandledrejection', function (e) {
    showBootError('שגיאה לא מטופלת:', e.reason);
  });
</script>

      padding:20px 22px 18px;
      margin-bottom:22px;
      box-shadow:var(--shadow-md);
      overflow:hidden;
    }
    .zl-appbar::after {
      content:""; position:absolute; inset:auto 0 0 0; height:3px;
      background:linear-gradient(90deg, var(--accent) 0%, rgba(230,40,42,0) 65%);
    }
    .zl-brand { display:flex; align-items:center; gap:14px; }
    .zl-brand-logo { flex:0 0 auto; height:46px; width:auto; display:block; }
    .zl-brand-text { min-width:0; }
    .zl-brand-title { font-size:1.45rem; font-weight:800; color:#fff; letter-spacing:-0.02em; line-height:1.15; margin:0; }
    .zl-brand-sub { font-size:0.74rem; font-weight:600; color:rgba(255,255,255,0.6); letter-spacing:0.08em; margin-top:3px; }
    .zl-brand-rule { width:44px; height:2px; background:var(--accent); margin-top:7px; border-radius:2px; }

    /* Corner controls: anchored to the header, so they scroll away with it
       instead of hovering over the content. */
    .zl-corner { position:absolute; left:14px; top:14px; display:flex; gap:8px; z-index:5; }
    .zl-iconbtn {
      position:relative;
      width:40px; height:40px; border-radius:50%;
      display:flex; align-items:center; justify-content:center;
      background:rgba(255,255,255,0.1); border:1px solid rgba(255,255,255,0.22);
      color:#fff; cursor:pointer; padding:0;
      backdrop-filter:blur(2px);
      touch-action:manipulation; -webkit-appearance:none;
    }
    .zl-iconbtn:hover { background:rgba(255,255,255,0.18); }
    .zl-syncdot {
      position:absolute; bottom:-2px; left:-2px;
      width:16px; height:16px; border-radius:50%;
      display:flex; align-items:center; justify-content:center;
      border:2px solid #00223B; color:#fff; background:var(--accent);
    }
    .zl-syncdot[data-ok="true"] { background:#2E9E6B; }
    .zl-syncmark {
      width:18px; height:18px; border-radius:50%;
      display:inline-flex; align-items:center; justify-content:center;
      color:#fff; background:var(--bad); flex:0 0 18px;
    }
    .zl-syncmark[data-ok="true"] { background:var(--ok); }

    /* ---- feedback ---- */
    .zl-root button { transition:transform .12s ease; }
    .zl-root button:active { transform:scale(0.97); }
    @keyframes zl-pop { 0% { transform:scale(0.92); } 60% { transform:scale(1.04); } 100% { transform:scale(1); } }
    @keyframes zl-shake { 0%,100% { transform:translateX(0); } 20% { transform:translateX(-5px); } 40% { transform:translateX(5px); } 60% { transform:translateX(-3px); } 80% { transform:translateX(3px); } }
    .zl-pop { animation:zl-pop .3s ease; }
    .zl-shake { animation:zl-shake .34s ease; }
    @media (prefers-reduced-motion: reduce) { .zl-pop, .zl-shake { animation:none; } }

    /* ---- login: a single card, navy above and form below ---- */
    .zl-login {
      background:var(--surface);
      border:1px solid var(--line);
      border-radius:var(--r-lg);
      overflow:hidden;
      box-shadow:var(--shadow-md);
    }
    .zl-login-head {
      position:relative;
      text-align:center;
      padding:26px 22px 22px;
      background:
        radial-gradient(115% 150% at 50% -30%, rgba(46,124,184,0.35) 0%, rgba(0,34,59,0) 62%),
        linear-gradient(160deg, #013A61 0%, #00223B 55%, #001A2E 100%);
    }
    .zl-login-head::after {
      content:""; position:absolute; inset:auto 0 0 0; height:3px;
      background:linear-gradient(90deg, var(--accent) 0%, rgba(230,40,42,0) 70%);
    }
    .zl-login-logo { width:min(190px, 58%); display:block; margin:2px auto 12px; }
    .zl-login-body { padding:20px; }

    /* ---- greeting screen ---- */
    @keyframes zl-rise { from { opacity:0; transform:translateY(12px) scale(0.97);} to { opacity:1; transform:none;} }
    .zl-greet {
      position:fixed; inset:0; z-index:2000;
      display:flex; flex-direction:column; align-items:center; justify-content:center; gap:22px;
      background:
        radial-gradient(120% 90% at 50% 0%, rgba(46,124,184,0.32) 0%, rgba(0,34,59,0) 62%),
        linear-gradient(165deg, #013A61 0%, #00223B 55%, #00121F 100%);
      padding:28px;
    }
    .zl-greet-logo { width:min(230px, 62vw); animation:zl-rise .5s ease both; }
    .zl-greet-hi {
      font-size:clamp(1.5rem, 6vw, 2.1rem); font-weight:800; color:#fff;
      text-align:center; line-height:1.5; margin:0;
      animation:zl-rise .5s ease .12s both;
    }
    .zl-greet-rule { width:70px; height:3px; background:var(--accent); border-radius:2px; animation:zl-rise .5s ease .2s both; }
    .zl-greet-note { font-size:0.8rem; color:rgba(255,255,255,0.62); animation:zl-rise .5s ease .28s both; }
    @media (prefers-reduced-motion: reduce) {
      .zl-greet-logo, .zl-greet-hi, .zl-greet-rule, .zl-greet-note { animation:none; }
    }

    /* ---- Surat al-Fatiha strip (inside the navy header) ---- */
    .zl-fatiha {
      margin-top:16px;
      padding:11px 14px 12px;
      background:rgba(255,255,255,0.05);
      border:1px solid rgba(255,255,255,0.14);
      border-radius:var(--r-md);
    }
    .zl-fatiha-head { display:flex; align-items:center; gap:10px; margin-bottom:7px; }
    .zl-fatiha-title { font-size:0.82rem; font-weight:700; color:rgba(255,255,255,0.85); }
    .zl-fatiha-rule { flex:1; height:1px; background:rgba(255,255,255,0.2); }
    .zl-fatiha-sub { font-size:0.62rem; font-weight:600; letter-spacing:0.06em; color:rgba(255,255,255,0.5); }
    .zl-fatiha-body {
      font-size:12px;
      font-weight:500;
      line-height:2.05;
      color:rgba(255,255,255,0.74);
      margin:0;
      text-align:justify;
      text-align-last:justify;
      text-justify:inter-word;
      hyphens:none;
      overflow-wrap:normal;
      word-break:normal;
    }
    .zl-fatiha-verse { white-space:normal; }
    .zl-fatiha-num {
      display:inline-flex; align-items:center; justify-content:center;
      width:15px; height:15px; margin-inline-start:5px; margin-inline-end:0;
      border-radius:50%;
      border:1px solid rgba(230,40,42,0.75);
      background:rgba(230,40,42,0.16);
      color:#FF9C9D;
      font-size:0.55rem; font-weight:700;
      vertical-align:2px;
    }

    /* ---- tabs ---- */
    .zl-tabs { display:flex; gap:4px; overflow-x:auto; border-bottom:1px solid var(--line); margin-bottom:20px; }
    .zl-tab {
      display:flex; align-items:center; gap:8px;
      background:none; border:none; padding:11px 15px;
      font:inherit; font-size:0.9rem; font-weight:500; color:var(--ink-muted);
      border-bottom:2px solid transparent; cursor:pointer; white-space:nowrap;
      transition:color .15s, border-color .15s;
    }
    .zl-tab:hover { color:var(--ink); }
    .zl-tab[data-active="true"] { font-weight:700; color:var(--navy); border-bottom-color:var(--accent); }

    .zl-dir { display:inline-flex; background:var(--bg); border:1px solid var(--line); border-radius:10px; padding:3px; gap:3px; }
    .zl-dir-btn { border:none; background:none; font:inherit; font-size:0.78rem; font-weight:600; color:var(--ink-muted); padding:6px 12px; border-radius:8px; cursor:pointer; white-space:nowrap; }
    .zl-dir-btn[data-active="true"] { background:var(--navy); color:var(--surface); }
    .zl-dirbar {
      display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap;
      background:var(--surface); border:1px solid var(--line); border-radius:var(--r-md);
      padding:11px 14px; margin:14px 0 18px; box-shadow:var(--shadow-sm);
    }
    .zl-dirbar-label { font-size:0.8rem; font-weight:700; color:var(--ink-muted); }

    .zl-search { width:100%; padding:11px 14px; border:1px solid var(--line); border-radius:10px; font:inherit; font-size:0.9rem; margin-bottom:10px; outline:none; background:var(--surface); color:var(--ink); }

    /* ---- session progress ---- */
    .zl-session { display:flex; align-items:center; gap:10px; margin-bottom:14px; }
    .zl-session-track { flex:1; height:6px; background:var(--line); border-radius:4px; overflow:hidden; }
    .zl-session-fill { display:block; height:100%; background:var(--navy); border-radius:4px; transition:width .3s ease; }
    .zl-session-num { font-size:0.8rem; font-weight:700; color:var(--ink-muted); flex:0 0 auto; }

    /* ---- routine week ---- */
    .zl-weeknav {
      flex:0 0 30px; align-self:stretch;
      display:flex; align-items:center; justify-content:center;
      background:var(--bg); border:1px solid var(--line); border-radius:10px;
      color:var(--navy); cursor:pointer; padding:0;
    }
    .zl-weeknav:disabled { opacity:0.3; cursor:default; }
    .zl-daydetail { border-top:1px solid var(--line); margin-top:12px; padding-top:10px; }
    .zl-week-card {
      position:relative; background:var(--surface); border:1px solid var(--line);
      border-radius:var(--r-lg); padding:18px 18px 14px; margin-bottom:20px;
      box-shadow:var(--shadow-sm); overflow:hidden;
    }
    .zl-week-card::before { content:""; position:absolute; inset:0 auto 0 0; width:3px; background:var(--accent); }
    .zl-week { flex:1 1 auto; min-width:0; display:flex; gap:6px; }
    .zl-day {
      flex:1 1 0; min-width:0;
      display:flex; flex-direction:column; align-items:center; gap:4px;
      padding:10px 2px 8px; border-radius:10px;
      background:var(--bg); border:1px solid var(--line);
      font:inherit; color:var(--ink); cursor:pointer;
      transition:background .15s, border-color .15s;
    }
    .zl-day[data-on="true"] { background:rgba(46,124,184,0.12); border-color:rgba(46,124,184,0.4); }
    .zl-day[data-full="true"] { background:var(--ok); border-color:var(--ok); color:#fff; }
    .zl-day[data-today="true"] { box-shadow:0 0 0 2px var(--accent); }
    .zl-day[data-open="true"] { border-color:var(--navy); }
    .zl-day[data-future="true"] { opacity:0.38; cursor:default; }
    .zl-day-name { font-size:0.8rem; font-weight:700; line-height:1; }
    .zl-day-num { font-size:0.68rem; opacity:0.6; line-height:1; }
    .zl-day-pips { display:flex; gap:2px; margin-top:2px; }
    .zl-pip { width:5px; height:5px; border-radius:50%; background:currentColor; opacity:0.18; }
    .zl-pip[data-on="true"] { opacity:1; color:var(--ok); }
    .zl-day[data-full="true"] .zl-pip[data-on="true"] { color:#fff; }
    .zl-due-line { display:flex; align-items:center; justify-content:space-between; gap:8px; width:100%; margin-top:12px; padding-top:10px; border-top:1px solid var(--line); font-size:0.82rem; color:var(--ink-muted); }

    /* ---- vocab filter bar ---- */
    .zl-sortbar { display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:10px; }
    .zl-sortbtn { display:inline-flex; align-items:center; gap:8px; background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:9px 14px; font:inherit; font-size:0.85rem; font-weight:700; color:var(--navy); cursor:pointer; box-shadow:var(--shadow-sm); }
    .zl-sortbtn[data-active="true"] { background:var(--navy); border-color:var(--navy); color:var(--surface); }
    .zl-sortpanel { background:var(--surface); border:1px solid var(--line); border-radius:var(--r-md); padding:12px; margin-bottom:12px; box-shadow:var(--shadow-sm); }
    .zl-sortrow { display:flex; align-items:center; gap:10px; width:100%; padding:9px 8px; background:none; border:none; border-radius:8px; font:inherit; font-size:0.87rem; cursor:pointer; text-align:right; color:inherit; }
    .zl-sortrow:hover { background:var(--bg); }
    .zl-sortbox { flex:0 0 18px; height:18px; border-radius:5px; border:1.5px solid var(--line); display:flex; align-items:center; justify-content:center; color:#fff; }
    .zl-sortrow[data-on="true"] .zl-sortbox { background:var(--navy); border-color:var(--navy); }
    .zl-sortcount { color:var(--ink-muted); font-size:0.78rem; }
    .zl-sortactions { display:flex; gap:8px; border-top:1px solid var(--line); margin-top:8px; padding-top:10px; }
    .zl-word { text-align:right; font:inherit; color:inherit; cursor:pointer; box-shadow:var(--shadow-sm); transition:transform .15s, box-shadow .15s; }
    .zl-word:hover { transform:translateY(-2px); box-shadow:var(--shadow-md); }

    /* ---- overlays ---- */
    .zl-overlay { position:fixed; inset:0; background:rgba(4,18,30,0.55); display:flex; align-items:center; justify-content:center; padding:16px; z-index:1000; backdrop-filter:blur(2px); }
    .zl-sheet { background:var(--surface); border-radius:var(--r-lg); padding:20px; width:100%; max-width:400px; box-shadow:var(--shadow-lg); max-height:88vh; overflow-y:auto; }
    /* During the tour the card occupies the lower part of the screen, so
       anything it is pointing at has to sit above it. */
    .zl-root[data-tour="true"] .zl-overlay { align-items:flex-start; padding-top:14px; }
    .zl-root[data-tour="true"] .zl-sheet { max-height:34vh; }
    .zl-sheet-row { display:flex; gap:10px; font-size:0.85rem; padding:8px 0; border-bottom:1px solid var(--line); }
    .zl-sheet-row:last-of-type { border-bottom:none; }
    .zl-sheet-key { flex:0 0 84px; color:var(--ink-muted); font-weight:600; }
    .zl-sheet-title { font-size:1.2rem; font-weight:800; color:var(--navy); margin:0; }

    .zl-mini { border:1px solid var(--line); background:var(--surface); color:var(--navy); border-radius:8px; padding:6px 12px; font:inherit; font-size:0.75rem; font-weight:700; cursor:pointer; }

    /* ---- the two halves of the personal area ---- */
    .zl-panes {
      display: flex; gap: 8px; margin-bottom: 16px;
      background: var(--bg); border: 1px solid var(--line);
      border-radius: 11px; padding: 4px;
    }
    .zl-pane {
      flex: 1; display: flex; align-items: center; justify-content: center; gap: 7px;
      background: none; border: none; border-radius: 8px;
      padding: 9px 6px; font: inherit; font-size: 0.86rem; font-weight: 700;
      color: var(--ink-muted); cursor: pointer;
      transition: background 0.18s, color 0.18s;
    }
    .zl-pane[data-on="true"] {
      background: var(--surface); color: var(--navy);
      box-shadow: var(--shadow-sm);
    }

    /* ---- first-run guide ---- */
    /* Anchored to the bottom rather than centred, and the backdrop only
       darkens the lower half — the tab being described stays visible above
       the card, which is the whole point of moving through the tabs. */
    .zl-guide-back {
      /* Above the personal-area sheet (1000), which the tour opens behind
         itself when a slide is about it. */
      position: fixed; inset: 0; z-index: 1200;
      display: flex; align-items: flex-end; justify-content: center;
      padding: 0 12px 12px;
      background: linear-gradient(to bottom, rgba(8,18,30,0) 0%, rgba(8,18,30,0.28) 42%, rgba(8,18,30,0.62) 68%);
      pointer-events: none;
    }
    .zl-guide {
      position: relative; width: 100%; max-width: 420px;
      background: var(--surface); border: 1px solid var(--line);
      border-radius: var(--r-lg); box-shadow: var(--shadow-lg);
      padding: 18px 18px 14px;
      max-height: 62vh; overflow-y: auto;
      pointer-events: auto;
    }
    .zl-guide-skip {
      position: absolute; top: 12px; left: 14px;
      background: none; border: none; font: inherit;
      font-size: 0.78rem; color: var(--ink-muted);
      cursor: pointer; padding: 4px 6px;
    }
    .zl-guide-slide { animation: zl-rise 0.28s ease both; }
    .zl-guide-icon {
      width: 38px; height: 38px; border-radius: 11px;
      display: flex; align-items: center; justify-content: center;
      background: var(--navy); color: var(--surface);
      margin-bottom: 10px;
    }
    .zl-guide-title { font-size: 1.12rem; font-weight: 800; margin-bottom: 6px; }
    .zl-guide-lead {
      font-size: 0.86rem; color: var(--ink-muted);
      line-height: 1.65; margin-bottom: 10px;
    }
    .zl-guide-hint {
      font-size: 0.68rem; color: var(--ink-muted); opacity: 0.7;
      text-align: center; margin-top: 12px;
    }
    .zl-guide-list { list-style: none; padding: 0; margin: 0; }
    .zl-guide-list li {
      position: relative; padding: 6px 18px 6px 0;
      font-size: 0.83rem; line-height: 1.55;
      border-bottom: 1px solid var(--line);
    }
    .zl-guide-list li:last-child { border-bottom: none; }
    .zl-guide-list li::before {
      content: ""; position: absolute; right: 4px; top: 15px;
      width: 6px; height: 6px; border-radius: 50%;
      background: var(--accent);
    }
    .zl-guide-dots {
      display: flex; gap: 7px; justify-content: center;
      margin: 10px 0 12px;
    }
    .zl-guide-dot {
      width: 8px; height: 8px; border-radius: 50%; padding: 0;
      border: none; background: var(--line); cursor: pointer;
      transition: background 0.2s, transform 0.2s;
    }
    .zl-guide-dot[data-on="true"] { background: var(--navy); transform: scale(1.35); }
    .zl-guide-nav { display: flex; gap: 10px; }
    .zl-guide-nav > * { flex: 1; justify-content: center; }

    /* ---- meeting picker ----
       Scrolls rather than growing to fifteen rows, so the rest of the
       personal area stays reachable on a phone. */
    .zl-meetings {
      max-height: 210px; overflow-y: auto;
      border: 1px solid var(--line); border-radius: var(--r-md);
      background: var(--bg); padding: 5px; margin-bottom: 8px;
    }
    .zl-meeting {
      display: flex; align-items: center; gap: 9px; width: 100%;
      background: none; border: 1px solid transparent; border-radius: 8px;
      padding: 8px 9px; font: inherit; color: var(--ink);
      cursor: pointer; text-align: right;
    }
    .zl-meeting:hover { background: var(--surface); }
    .zl-meeting[data-on="true"] {
      background: var(--surface); border-color: var(--navy);
      box-shadow: var(--shadow-sm);
    }
    .zl-meeting[data-open="false"] { opacity: 0.5; }
    .zl-meeting-name { flex: 0 0 74px; font-size: 0.85rem; font-weight: 700; }
    .zl-meeting[data-on="true"] .zl-meeting-name { color: var(--navy); }
    .zl-meeting-track {
      flex: 1; height: 7px; border-radius: 4px; overflow: hidden;
      background: var(--line); display: flex; flex-direction: row-reverse;
    }
    .zl-meeting-fill { display: block; height: 100%; border-radius: 4px; }
    .zl-meeting-pct { flex: 0 0 42px; text-align: left; font-size: 0.76rem; font-weight: 600; color: var(--ink-muted); }

    /* ---- statistics ---- */
    .zl-stat-grid { display:grid; grid-template-columns:repeat(auto-fit, minmax(120px, 1fr)); gap:10px; margin-bottom:16px; }
    .zl-stat { position:relative; background:var(--surface); border:1px solid var(--line); border-radius:var(--r-md); padding:15px; box-shadow:var(--shadow-sm); overflow:hidden; }
    .zl-stat::before { content:""; position:absolute; inset:0 auto 0 0; width:3px; background:var(--navy); opacity:0.5; }
    .zl-stat-num { font-size:1.75rem; font-weight:800; color:var(--navy); line-height:1.1; }
    .zl-stat-label { font-size:0.76rem; color:var(--ink-muted); margin-top:3px; }
    .zl-bars { display:flex; align-items:flex-end; gap:6px; height:110px; margin:14px 0 6px; }
    .zl-bar-col { flex:1; display:flex; flex-direction:column; justify-content:flex-end; align-items:center; gap:5px; height:100%; }
    .zl-bar { width:100%; background:var(--focus); border-radius:5px 5px 0 0; min-height:3px; }
    .zl-bar[data-today="true"] { background:var(--navy); }
    .zl-bar-label { font-size:0.66rem; color:var(--ink-muted); white-space:nowrap; }
    .zl-bar-val { font-size:0.7rem; font-weight:700; color:var(--navy); }
    .zl-trow { display:flex; align-items:center; gap:10px; padding:7px 0; }
    .zl-trow-name { flex:0 0 34%; font-size:0.82rem; font-weight:600; }
    .zl-trow-track { flex:1; height:9px; background:var(--line); border-radius:5px; overflow:hidden; display:flex; flex-direction:row-reverse; }
    .zl-legend { display:flex; flex-wrap:wrap; gap:12px; margin-top:12px; padding-top:10px; border-top:1px solid var(--line); font-size:0.74rem; color:var(--ink-muted); }
    .zl-legend-item { display:inline-flex; align-items:center; gap:5px; }
    .zl-legend-dot { width:9px; height:9px; border-radius:50%; display:inline-block; }
    .zl-trow-val { font-size:0.75rem; color:var(--ink-muted); flex:0 0 52px; text-align:left; }

    /* ---- practice method rows ---- */
    .zl-method {
      background:var(--surface);
      border:1px solid var(--line);
      border-radius:var(--r-md);
      margin-bottom:12px;
      overflow:hidden;
      box-shadow:var(--shadow-sm);
      transition:border-color .15s, box-shadow .15s;
    }
    .zl-method:hover { box-shadow:var(--shadow-md); }
    .zl-method[data-open="true"] { border-color:var(--navy); }
    .zl-method-head {
      display:flex; align-items:center; gap:14px;
      width:100%; padding:18px;
      background:none; border:none; cursor:pointer;
      text-align:right; font:inherit; color:inherit;
    }
    .zl-method-icon {
      flex:0 0 44px; height:44px; border-radius:12px;
      background:var(--bg); color:var(--navy);
      display:flex; align-items:center; justify-content:center;
      transition:background .15s, color .15s;
    }
    .zl-method[data-open="true"] .zl-method-icon { background:var(--navy); color:var(--surface); }

/* =========================================================================
   PROGRESS HELPERS
   ========================================================================= */
/* =========================================================================
   SPACED REPETITION
   Each item carries its own next-review date. A correct answer pushes the
   review one rung further out along the ladder below; a wrong answer resets
   the ladder and brings the item back in this same session. The ladder tops
   out at two weeks on purpose — longer gaps feel like forgetting. Items that are due
   (or have never been seen) are what the practice queues serve first.
   ========================================================================= */
const DAY_MS = 86400000;
const SRS_LADDER = [1, 2, 4, 7, 10, 14];

/* Flashcards run as a finite session rather than an endless loop. The daily
   session covers what the schedule says is due, capped so a backlog never
   turns into an unfinishable pile; opening flashcards from the practice list
   is a shorter, off-schedule drill. */
/* The daily card session follows the queue rather than a fixed number: it
   serves whatever is actually due, up to a ceiling. A fixed size stops
   working once several meetings are open — twenty cards covered a seventh of
   meeting 1, but would cover a fortieth of six meetings, and the older
   material would quietly stop coming round. */
const SESSION_CAP = 30;
const SESSION_MIN = 10;

/* Knowing the material well enough to build on it, which is what marking the
   next meeting really asks. A full week of the daily routine earns about 46%,
   so this sits just under that: reachable by keeping at it, not by turning up
   once. Distinct from mastery, which asks whether you will still know it in a
   month and takes two to three weeks per meeting. */
const READY_PCT = 45;

/* The book runs to fifteen meetings. Words and practice sentences belong to
   the meeting that introduced them; letters and idioms carry no meeting at
   all, because they are not taught in one — they stay available throughout.

   Nothing is ever locked. The meeting you mark simply decides which material
   the practice queues draw on, so the app follows the course rather than
   deciding when you are allowed to move on. */
const TOTAL_MEETINGS = 15;

function itemMeeting(item) {
    return item && typeof item.meeting === "number" ? item.meeting : 0;
}

/* 0 means "not tied to a meeting" and is always in play. */
function isUnlocked(item, upTo) {
    const m = itemMeeting(item);
    return m === 0 || m <= upTo;
}

/* How long one sitting runs. A session that ends is a session you finish. */
/* The morning session: mostly recognition, with a third of the questions
   asking for the word to be produced from memory. Declared here with the
   other session sizes because the daily routine's description reads it. */
const MORNING_PLAN = { choice: 20, typed: 10 };

const SESSION_SIZES = {
    flashcards: 20,
    quiz: 20,
    builder: 10,
    reading: 5,
    idioms: 5,
};

function isDue(item) {
    return !item.dueAt || item.dueAt <= Date.now();
}

function dueCount(list) {
    return list.filter(isDue).length;
}

function scheduleNext(item, correct) {
    const streak = correct ? (item.streak || 0) + 1 : 0;
    const days = correct ? SRS_LADDER[Math.min(streak - 1, SRS_LADDER.length - 1)] : 0;
    return { streak: streak, dueAt: Date.now() + days * DAY_MS, lastSeen: Date.now() };
}

function dueLabel(item) {
    if (isDue(item)) return "לחזרה היום";
    const days = Math.ceil((item.dueAt - Date.now()) / DAY_MS);
    if (days <= 1) return "מחר";
    return "בעוד " + days + " ימים";
}

/* Not every right answer is worth the same.

   Picking the right option out of four is recognition; typing the word from
   memory, or assembling a whole sentence, is recall — a different and harder
   skill. Counting them equally would flatter a score built entirely on
   multiple choice, so recall is worth double.

   A wrong answer costs half a point and never resets the word to zero. One
   slip on a tired evening should cost a step backwards, not a month of work.  */
const ANSWER_WEIGHT = {
    choice: 1,      // multiple choice — recognition
    card: 1,        // a flashcard marked "ידעתי" — self-reported recall
    typed: 2,       // typed from memory
    sentence: 2,    // a sentence assembled correctly
};

function answerCredit(kind) {
    return ANSWER_WEIGHT[kind] || 1;
}

const MASTERY_TARGET = 6;
/* `correctCount` accumulates credit, not answers, so it can hold halves. */
const netScore = (item) => Math.max(0, (item.correctCount || 0) - 0.5 * (item.wrongCount || 0));
const progressPct = (item) => Math.min(100, Math.round((netScore(item) / MASTERY_TARGET) * 100));
const isMastered = (item) => progressPct(item) >= 100;
const isStruggling = (item) => !isMastered(item) && (item.wrongCount || 0) >= 2 && progressPct(item) < 50;

/* A continuous read on how well a deck is known, as opposed to how many of
   its items have crossed the mastery line. Every item contributes what it has
   earned so far, so an evening of good practice moves the number instead of
   leaving it at zero for a month. */
function knowledgeScore(items) {
    const list = items || [];
    if (list.length === 0) return 0;
    const sum = list.reduce((acc, it) => acc + Math.min(1, netScore(it) / MASTERY_TARGET), 0);
    return Math.round((sum / list.length) * 100);
}

function withProgressFields(list) {
    return list.map((i) => ({ correctCount: 0, wrongCount: 0, ...i }));
}

/* Every practice mode runs shuffled. The order is drawn fresh each pass, and
   weighted: an item you have been getting wrong is pulled toward the front,
   an item you have mastered drifts to the back. The random multiplier keeps
   two passes from ever looking the same. */
/* A word can carry more than one sense (אַמִין is a role and also a man's
   name). Practice picks one of them per card, so both get drilled; when
   checking a typed answer, every sense is accepted. */
function allMeanings(item) {
    return [item.back].concat(item.alts || []).filter(Boolean);
}

function pickMeaning(item) {
    const list = allMeanings(item);
    return list[Math.floor(Math.random() * list.length)];
}

/* A small tilt toward the meeting most recently opened.

   The heavy lifting for new material is already done by the "never reviewed"
   term below, which is worth 1.5. This bonus is deliberately an order smaller:
   its job is to break the tie *among* untouched items so that the meeting you
   just started comes up before words from meeting 1 you never got to — not to
   outrank the review schedule.

   The size matters. An earlier version used 1.2 and a brand-new word overtook
   a word that was a week overdue, which is exactly backwards: lateness is the
   strongest evidence of forgetting there is. At 0.3 the ordering holds, and
   the bonus fades to nothing after four correct answers. */
function freshMeetingBonus(item, currentMeeting) {
    if (!currentMeeting || itemMeeting(item) !== currentMeeting) return 0;
    const right = item.correctCount || 0;
    return Math.max(0, 0.3 - 0.075 * right);
}

/* Practice is centred on the meeting in hand.

   The one before it stays close behind, the one before that is thinner, and
   anything older is present but quiet. This is a multiplier rather than a
   subtraction, so it scales the whole weight — including the overdue term.
   That matters: a word from meeting 1 that is genuinely late still climbs
   back up, which is what stops old material from being lost as the course
   moves on. */
function meetingDistanceFactor(item, currentMeeting) {
    const m = itemMeeting(item);
    if (!m || !currentMeeting) return 1;          // letters and idioms
    const back = currentMeeting - m;
    if (back <= 0) return 1;
    if (back === 1) return 0.7;
    if (back === 2) return 0.45;
    return 0.28;
}

function itemWeight(item, currentMeeting) {
    const right = item.correctCount || 0;
    const wrong = item.wrongCount || 0;
    let weight = 1 + 1.6 * wrong - 0.45 * right;
    if (isMastered(item)) weight = Math.min(weight, 0.3);
    weight = Math.max(0.25, weight);
    const fresh = freshMeetingBonus(item, currentMeeting);
    const near = meetingDistanceFactor(item, currentMeeting);
    if (!item.dueAt) return (weight + 1.5 + fresh) * near;   // never reviewed — show it early
    const overdueDays = (Date.now() - item.dueAt) / DAY_MS;
    if (overdueDays < 0) return weight * 0.12 * near;        // scheduled for a later day
    /* Lateness is added after the distance factor, not multiplied by it.
       Scaling it too would mean an old meeting could never climb back no
       matter how thoroughly it had been forgotten — which is precisely the
       material that most needs to return. Being far behind makes a word
       quieter; being overdue still makes it urgent. */
    return (weight + fresh) * near + Math.min(3, overdueDays);
}

/* How a session is divided between the meetings that are open.

   Each meeting back gets half the share of the one in front of it, and the
   shares are normalised to fill the session. Two meetings open give 67/33,
   three give 57/29/14, four 53/27/13/7 — the split rebalances itself as the
   course goes on, without a number to retune.

   Weighting alone could not produce this. Once a new word is answered
   correctly it is scheduled a day or more out and its weight collapses, while
   older material that has come due keeps arriving; measured over a session,
   the current meeting fell to about one percent within a week of opening it.
   So the division is made explicit, and the usual weighting decides the order
   inside each meeting's own share. */
const MEETING_DECAY = 0.5;

function meetingShares(openMeetings) {
    const weights = openMeetings.map((_, i) => Math.pow(MEETING_DECAY, i));   // newest first
    const total = weights.reduce((a, b) => a + b, 0);
    return weights.map((w) => w / total);
}

function composeSession(deck, currentMeeting, size) {
    if (!currentMeeting || deck.length === 0) {
        return weightedOrder(deck, currentMeeting).slice(0, size);
    }
    /* Group by meeting, newest first. Letters and idioms carry no meeting;
       they ride along with the current one rather than forming a group of
       their own, since they are meant to stay in circulation throughout. */
    const groups = new Map();
    deck.forEach((item, i) => {
        const m = itemMeeting(item) || currentMeeting;
        if (!groups.has(m)) groups.set(m, []);
        groups.get(m).push(i);
    });
    const meetings = Array.from(groups.keys()).sort((a, b) => b - a);
    if (meetings.length < 2) return weightedOrder(deck, currentMeeting).slice(0, size);

    const shares = meetingShares(meetings);
    const ranked = meetings.map((m) => {
        const group = groups.get(m);
        return weightedOrder(group.map((i) => deck[i]), currentMeeting).map((k) => group[k]);
    });

    /* Hand out the slots, then give any that could not be filled — because a
       meeting has run out of cards — to the meetings that still have some. */
    const want = shares.map((s) => Math.round(size * s));
    const taken = ranked.map((list, i) => list.slice(0, Math.min(want[i], list.length)));
    let short = size - taken.reduce((n, list) => n + list.length, 0);
    for (let i = 0; i < ranked.length && short > 0; i++) {
        const extra = ranked[i].slice(taken[i].length, taken[i].length + short);
        taken[i] = taken[i].concat(extra);
        short -= extra.length;
    }
    return shuffle([].concat.apply([], taken));
}

function weightedOrder(data, currentMeeting) {
    return data
        .map((d, i) => ({ i: i, score: itemWeight(d, currentMeeting) * (0.55 + Math.random() * 0.9) }))
        .sort((a, b) => b.score - a.score)
        .map((entry) => entry.i);
}

function shuffle(arr) {
    const a = [...arr];
    for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
}

/* FIX #3: items added to DEFAULT_VOCAB / ALPHABET after a user's first visit
   never appeared, because the saved copy in localStorage replaced the
   defaults wholesale. New default items are now merged in by id, while
   saved progress and user-created words are preserved. */
function mergeDefaults(stored, defaults) {
    if (!Array.isArray(stored)) return withProgressFields(defaults);
    // NOTE: this used to build the copies first and then Object.assign onto the
    // ORIGINAL stored objects, so new fields on the built-in items (topic, and
    // anything added later) never reached the list that was actually returned.
    const merged = stored.map((item) => ({ correctCount: 0, wrongCount: 0, ...item }));
    const byId = new Map(merged.map((item) => [item.id, item]));
    defaults.forEach((def) => {
        const existing = byId.get(def.id);
        if (!existing) {
            merged.push({ correctCount: 0, wrongCount: 0, ...def });
        } else {
            const keep = {
                correctCount: existing.correctCount || 0,
                wrongCount: existing.wrongCount || 0,
                streak: existing.streak,
                dueAt: existing.dueAt,
                lastSeen: existing.lastSeen,
            };
            Object.assign(existing, def, keep);
        }
    });
    return merged;
}

/* =========================================================================
   PERSISTENCE (localStorage)
   ========================================================================= */
function usePersistedState(key, initial, reviver) {
    const [state, setState] = useState(() => {
        try {
            const raw = window.localStorage.getItem(key);
            if (!raw) return initial;
            const parsed = JSON.parse(raw);
            return reviver ? reviver(parsed) : parsed;
        }
        catch (e) {
            return initial;
        }
    });
    useEffect(() => {
        try {
            window.localStorage.setItem(key, JSON.stringify(state));
        }
        catch (e) {
            /* storage unavailable — ignore */
        }
    }, [key, state]);
    return [state, setState];
}

function wordKey(text) {
    return String(text || "")
        .replace(/[\u0591-\u05C7\u0610-\u065F]/g, "")
        .replace(/[\s()'"\u2013\-,.\/]/g, "");
}

function initialVocab() {
    const base = withProgressFields(DEFAULT_VOCAB);
    const byKey = new Map(base.map((w) => [wordKey(w.front), w]));
    const retired = new Set(LEGACY_FRONTS.map(wordKey));
    let nextId = DEFAULT_VOCAB.reduce((m, w) => Math.max(m, w.id || 0), 0);
    const extraKeys = new Set();

    ["vocab-data-v4", "vocab-data-v3", "vocab-data-v2", "vocab-data"].forEach((key) => {
        let stored = null;
        try { stored = JSON.parse(window.localStorage.getItem(key) || "null"); }
        catch (e) { stored = null; }
        if (!Array.isArray(stored)) return;
        stored.forEach((w) => {
            if (!w || !w.front) return;
            const k = wordKey(w.front);
            const builtIn = byKey.get(k);
            if (builtIn) {
                // same word, keep whichever history is further along
                builtIn.correctCount = Math.max(builtIn.correctCount || 0, w.correctCount || 0);
                builtIn.wrongCount = Math.max(builtIn.wrongCount || 0, w.wrongCount || 0);
                if (w.streak) builtIn.streak = Math.max(builtIn.streak || 0, w.streak);
                if (w.dueAt) builtIn.dueAt = Math.max(builtIn.dueAt || 0, w.dueAt);
                return;
            }
            if (retired.has(k)) return;          // an old copy of a built-in word
            if (extraKeys.has(k)) return;
            extraKeys.add(k);
            nextId += 1;
            base.push({ correctCount: 0, wrongCount: 0, ...w, id: nextId, topic: w.topic || "מילים שלי" });
        });
    });
    return base;
}

/* The surah is rendered as one justified block. Both edges are flush on every
   line, and the type size is auto-fitted so the final line lands full-width
   instead of leaving a short "tail" — the fit re-runs on resize, orientation
   change and after the webfont loads, so it holds on any screen. */
const FATIHA_MIN_PX = 10;
const FATIHA_MAX_PX = 17;
const FATIHA_STEP_PX = 0.15;

function lastLineFill(el) {
    const range = document.createRange();
    range.selectNodeContents(el);
    const rects = Array.from(range.getClientRects()).filter((r) => r.width > 1 && r.height > 1);
    if (rects.length === 0) return { ratio: 1, lines: 1 };
    const lines = [];
    rects.forEach((r) => {
        const line = lines.find((l) => Math.abs(l.top - r.top) < 6);
        if (line) {
            line.left = Math.min(line.left, r.left);
            line.right = Math.max(line.right, r.right);
        } else {
            lines.push({ top: r.top, left: r.left, right: r.right });
        }
    });
    lines.sort((a, b) => a.top - b.top);
    const last = lines[lines.length - 1];
    const width = el.clientWidth || 1;
    return { ratio: Math.min(1, (last.right - last.left) / width), lines: lines.length };
}

function fitFatiha(el) {
    if (!el || !el.clientWidth) return;
    el.style.textAlignLast = "auto";
    let best = null;
    /* Search the whole size range rather than stopping at the first decent
       result: on a wide screen only a few sizes make the final line land near
       the edge, and those are what keep the block rectangular. */
    for (let px = FATIHA_MAX_PX; px >= FATIHA_MIN_PX - 0.001; px -= FATIHA_STEP_PX) {
        el.style.fontSize = px.toFixed(2) + "px";
        const measured = lastLineFill(el);
        if (measured.lines === 1) {
            if (!best) best = { px: px, ratio: 1, lines: 1 };
            continue;
        }
        if (!best || best.lines === 1 || measured.ratio > best.ratio + 0.003) {
            best = { px: px, ratio: measured.ratio, lines: measured.lines };
        }
        if (measured.ratio >= 0.985) break;
    }
    el.style.fontSize = (best ? best.px.toFixed(2) : "14") + "px";
    // stretch the last line only when it is already close to the edge
    const worthJustifying = best && best.lines > 1 && best.ratio >= 0.7;
    el.style.textAlignLast = worthJustifying ? "justify" : "right";
}

const NOON_GAMES = [
    { screen: "pairs", kind: "number", label: "יחיד ורבים" },
    { screen: "pairs", kind: "gender", label: "זכר ונקבה" },
    { screen: "clock", label: "נגד השעון" },

function dayNoise(key, salt) {
    let h = 2166136261;
    const text = key + "|" + salt;
    for (let i = 0; i < text.length; i++) {
        h ^= text.charCodeAt(i);
        h = Math.imul(h, 16777619);
    }
    return ((h >>> 0) % 100000) / 100000;
}

/* Two different games on a games day, so a small deck — the gender pairs are
   the smallest — is not shown twice in one sitting. */
function noonPlanFor(dateKey) {
    if (dayNoise(dateKey, "noon-mode") < 0.5) {
        return { mode: "reading" };
    }
    const order = NOON_GAMES.map((g, i) => ({ g: g, r: dayNoise(dateKey, "game" + i) }))
        .sort((a, b) => a.r - b.r).map((x) => x.g);
    return { mode: "games", games: [order[0], order[1]] };
}

   03:00 Israel time the checklist jumped back to the previous day's boxes.
   The key is now built from the local date. */
function localDateKey(d) {
    const dt = d || new Date();
    const pad = (n) => String(n).padStart(2, "0");
    return dt.getFullYear() + "-" + pad(dt.getMonth() + 1) + "-" + pad(dt.getDate());

   tasks were ticked on each day. Read straight out of the checklist that is
   already stored. `weeksBack` steps to whole earlier weeks, so the columns
   never shift under the day names. */

    const names = ["א", "ב", "ג", "ד", "ה", "ו", "ש"];
    const todayKey = localDateKey();
    const sunday = new Date();
    sunday.setHours(0, 0, 0, 0);
    sunday.setDate(sunday.getDate() - sunday.getDay() - (weeksBack || 0) * 7);
    const days = [];
    for (let i = 0; i < 7; i++) {
        const date = new Date(sunday);
        date.setDate(sunday.getDate() + i);
        const key = localDateKey(date);
        const entry = checklist[key] || {};
        const doneKeys = Object.keys(entry).filter((k) => entry[k]);

            key: key,
            name: names[i],
            date: date.getDate() + "." + (date.getMonth() + 1),
            done: doneKeys.length,
            doneKeys: doneKeys,
            today: key === todayKey,
            future: key > todayKey,
        });
    }
    return days;
}

/* =========================================================================
   DECKS
   Words, letters, sentences and idioms are four separate banks, but every
   practice mode wants to treat them the same way: draw an item, show a
   front, show a back, record the answer. `buildDeck` tags each item with
   the bank it came from so a single component can drill any mixture of
   them, and `applyResult` sends the score back to the right bank.
   ========================================================================= */
/* Some sentences are for reading only. The booklet's pronoun drills run to a
   dozen words, and breaking one into tiles — plus decoys — produces a wall of
   buttons that is unusable on a phone. They stay in the flashcard and
   fill-in-the-blank decks, where length costs nothing. */
function isAssemblable(item) {
    return !item.readOnly;
}

function tagDeck(list, name) {
    return (list || []).map((item) => ({ ...item, _deck: name, _key: name + ":" + item.id }));
}

function buildDeck(kind, banks) {
    /* `banks.meeting` is how far the learner has marked themselves in the
       course. Letters and idioms carry no meeting and survive the filter.

       If the meeting is missing the filter is skipped rather than applied with
       a zero, which would quietly empty every deck. A fault here should leave
       too much material on the table, never none. */
    const upTo = banks.meeting;
    const limited = typeof upTo === "number" && upTo >= 1;
    const pick = (name) => {
        const deck = tagDeck(banks[name], name);
        return limited ? deck.filter((it) => isUnlocked(it, upTo)) : deck;
    };
    if (kind === "mix") return pick("vocab").concat(pick("letters"));
    return pick(kind);
}

/* The two faces of a card, whichever bank it came from. `reversed` means the
   prompt is the Hebrew side and the answer is the Arabic one — the harder
   direction, and the one that speaking actually needs. */
function cardFaces(item, reversed) {
    if (item._deck === "letters") {
        return {
            front: reversed ? item.name : item.letter,
            back: reversed ? item.letter : item.name,
            frontArabic: !reversed,
            backArabic: reversed,
            note: (item.hebrew ? item.hebrew + " · " : "") + item.sound,

    }
    if (item._deck === "sentences") {
        return {
            front: reversed ? item.hebrew : item.arabic,
            back: reversed ? item.arabic : item.hebrew,
            frontArabic: false, backArabic: false, note: "",
        };
    }
    if (item._deck === "idioms") {
        return {
            front: reversed ? item.meaning : item.arabic,
            back: reversed ? item.arabic : item.meaning,
            frontArabic: false, backArabic: false,
            note: "פירוש מילולי: " + item.literal,

    const sense = item._sense || item.back;
    return {
        front: reversed ? sense : item.front,
        back: reversed ? item.front : sense,
        frontArabic: false, backArabic: false, note: "",

    const size = MORNING_PLAN.choice + MORNING_PLAN.typed;

/* =========================================================================
   SENTENCE BUILDER
   ========================================================================= */
function normAnswer(text) {
    return String(text || "")
        .replace(/[\u0591-\u05C7\u0610-\u065F]/g, "")   // vowel points and shadda
        /* A phone keyboard is not a typewriter: iOS folds "..." into a single
           ellipsis, quotes come out curly, and the Hebrew geresh has its own
           codepoint. All of them are stripped so a right answer typed on a
           phone is never marked wrong over punctuation. */
        .replace(/[\s()\[\]{}'"\u2018\u2019\u201C\u201D\u05F3\u05F4\u2013\u2014\u2026\u05BE\-,.:;!?\/\\]/g, "")
        .trim();
}

/* A word with several meanings counts as correct on any one of them:
   "דלת / שער" accepts דלת, or שער, or the whole string. */
function acceptableAnswers(text) {
    const out = new Set();
    const add = (t) => { const k = normAnswer(t); if (k) out.add(k); };
    add(text);
    const withoutBrackets = String(text || "").replace(/\([^)]*\)/g, " ");
    add(withoutBrackets);
    withoutBrackets.split("/").forEach(add);
    String(text || "").split("/").forEach(add);
    (String(text || "").match(/\(([^)]*)\)/g) || []).forEach((seg) => {
        seg.replace(/[()]/g, "").split("/").forEach(add);
    });
    return out;
}

/* Words thrown into the bank that do not belong to the sentence.

   They are drawn from the other sentences in the same deck, so they are real
   words in the right register — sometimes near-misses from a similar sentence,
   sometimes plainly unrelated. Anything that already appears in the answer is
   excluded, otherwise a decoy could be indistinguishable from a tile that is
   genuinely needed.

   The count varies to keep the drill from becoming predictable, but a long
   sentence gets fewer: the bank is already crowded, and on a phone it would
   otherwise run to several lines. */
function decoyCount(answerLength) {
    const max = answerLength > 4 ? 2 : 4;
    return 1 + Math.floor(Math.random() * max);
}

function pickDecoys(item, dir, pool, answerWords) {
    const reversed = dir === "he2ar";
    const taken = new Set(answerWords);
    const words = [];
    (pool || []).forEach((other) => {
        if (other._key === item._key) return;
        const text = reversed ? other.arabic : other.hebrew;
        String(text || "").split(" ").forEach((word) => {
            if (!word || taken.has(word)) return;
            taken.add(word);
            words.push(word);
        });
    });
    return shuffle(words).slice(0, decoyCount(answerWords.length));
}

/* =========================================================================
   GAMES

   Lighter drills that still count towards what you know — but at the weight
   of recognition, not recall. Matching a pair or picking from a closed set of
   tiles is easier than producing the word, so each correct answer is worth
   the same as a multiple-choice answer rather than a typed one.
   ========================================================================= */
const GAME_SIZES = { pairs: 4, clock: 60, blank: 5 };

/* ---- pairing ------------------------------------------------------------
   Two columns of tiles; tap one on each side to join them. The pairs come
   either from the singular/plural links already in the word list, or from the
   masculine/feminine ones. */
function buildPairRounds(deck, kind, count) {
    const byId = new Map(deck.map((d) => [d.id, d]));
    const seen = new Set();
    const rounds = [];
    deck.forEach((item) => {
        if (seen.has(item.id)) return;
        let mate = null;
        if (kind === "gender") {
            mate = item.mate ? byId.get(item.mate) : null;
        } else if (item.form === "יחיד" && item.pair && item.pair.length) {
            mate = byId.get(item.pair[0]);
        }
        if (!mate || seen.has(mate.id)) return;
        seen.add(item.id); seen.add(mate.id);
        /* The left column always holds the same side of the relationship, so
           the exercise is "find its partner" rather than a free-for-all. */
        rounds.push(kind === "gender" && item.gender === "f"
            ? { left: mate, right: item }
            : { left: item, right: mate });
    });
    return shuffle(rounds).slice(0, count);
}

    const deck = useMemo(() => buildDeck("vocab", banks), [banks]);
    const [rounds, setRounds] = useState(() => buildPairRounds(deck, kind, GAME_SIZES.pairs));
    const [leftPick, setLeftPick] = useState(null);
    const [done, setDone] = useState({});
    const [missed, setMissed] = useState(null);
    const [tally, setTally] = useState({ right: 0, wrong: 0 });
    const [finished, setFinished] = useState(false);
    const timerRef = useRef(null);

    const rightOrder = useMemo(() => shuffle(rounds.map((_, i) => i)), [rounds]);

    const restart = () => {
        setRounds(buildPairRounds(deck, kind, GAME_SIZES.pairs));
        setLeftPick(null); setDone({}); setMissed(null);

/* ---- fill in the blank --------------------------------------------------
   A sentence from the booklet with one word removed. Meaning in context,
   rather than a word standing on its own. */
function buildBlankTask(deck, item, dir) {
    const reversed = dir === "he2ar";
    const text = reversed ? item.arabic : item.hebrew;
    const words = text.split(" ").filter(Boolean);
    if (words.length < 3) return null;
    const at = 1 + Math.floor(Math.random() * (words.length - 1));
    const answer = words[at];

    const taken = new Set([answer]);
    const options = [];
    shuffle(deck).forEach((other) => {
        if (other._key === item._key || options.length >= 3) return;
        const pool = (reversed ? other.arabic : other.hebrew).split(" ").filter(Boolean);
        const word = pool[Math.floor(Math.random() * pool.length)];
        if (!word || taken.has(word)) return;
        taken.add(word); options.push(word);
    });
    if (options.length < 2) return null;
    return {
        before: words.slice(0, at).join(" "),
        after: words.slice(at + 1).join(" "),
        prompt: reversed ? item.hebrew : item.arabic,
        answer: answer,
        options: shuffle([answer].concat(options)),
    };
}

/* =========================================================================
   FULL EXAM
   Thirty-one questions drawn from all four banks. Categories are not worth
   the same: producing a whole sentence exercises vocabulary *and* syntax,
   while naming a letter is recall of a label — so the weights below decide
   the final mark rather than a raw count of right answers.

   The exam only measures. It deliberately does not touch the review
   schedule, so sitting an exam cannot disturb the spacing of your practice.
   ========================================================================= */
const EXAM_PLAN = [
    { kind: "vocab", deck: "vocab", count: 15, weight: 50, label: "אוצר מילים" },
    { kind: "sentence", deck: "sentences", count: 5, weight: 30, label: "הרכבת משפטים" },
    { kind: "idiom", deck: "idioms", count: 3, weight: 12, label: "ניבי לשון" },
    { kind: "letter", deck: "letters", count: 8, weight: 8, label: "אלף-בית" },
];
const EXAM_TOTAL = 31;

function examCategoryMeta(kind) {
    return EXAM_PLAN.filter((p) => p.kind === kind)[0] || { label: kind, weight: 0, count: 1 };
}

/* Draw a fresh set of tasks. Items are chosen by the same weighting the
   practice queues use, so a shaky word is likelier to be tested, and the
   order is shuffled so no two exams feel alike. */
/* "ב..." normalises down to a single letter — there is nothing to type and
   nothing to judge. Words like that are always asked as multiple choice. */
function isTypeable(item) {
    return allMeanings(item).some((m) => normAnswer(m).length >= 2);
}

function buildExamTasks(banks) {
    const tasks = [];
    EXAM_PLAN.forEach((part) => {
        /* The exam asks sentences by assembly, so it draws from the same
           subset the assembly drill uses. */
        const deck = part.kind === "sentence"
            ? buildDeck(part.deck, banks).filter(isAssemblable)
            : buildDeck(part.deck, banks);
        if (deck.length === 0) return;
        const picked = weightedOrder(deck, banks.meeting).slice(0, part.count).map((i) => deck[i]);
        picked.forEach((item, idx) => {
            const dir = resolveDir("mix");
            if (part.kind === "sentence") {
                tasks.push({ kind: "sentence", item: item, dir: dir });
            } else if (part.kind === "vocab") {
                /* Half the word questions are typed rather than picked. Typing is
                   only ever asked when the prompt is Arabic, so the answer stays
                   in Hebrew and the keyboard never has to switch. */
                const open = idx % 2 === 1 && dir === "ar2he" && isTypeable(item);
                tasks.push({ kind: "vocab", item: item, dir: dir, open: open, question: buildQuestion(deck, item, dir) });
            } else {
                tasks.push({ kind: part.kind, item: item, dir: dir, question: buildQuestion(deck, item, dir) });
            }
        });
    });
    return shuffle(tasks);
}

/* A short read on the result, built from the per-category scores. */
/* A short read on the result.

   The bars above it already show how many questions were right in each
   category, so repeating that adds nothing. What the bars cannot show is
   where the *marks* went: the categories are weighted, so one missed sentence
   costs six points while a missed letter costs one. 14/15 on vocabulary is a
   bigger dent than 7/8 on letters, and nobody works that out in their head.
   That is what this paragraph is for. */
const EXAM_TIPS = {
    vocab: "סבב כרטיסיות יומי הוא הדרך המהירה לסגור את זה.",
    sentence: "תרגול הרכבת משפטים בכיוון עברית ← ערבית מטפל בזה ישירות.",
    idiom: "הניבים הם הקטגוריה הקטנה — כמה סבבים קצרים והם נסגרים.",
    letter: "סבב כרטיסיות אותיות של חמש דקות בדרך כלל מספיק.",
};

function examVerdict(score) {
    if (score >= 90) return "תוצאה מצוינת.";
    if (score >= 75) return "תוצאה טובה.";
    if (score >= 60) return "תוצאה סבירה.";
    return "יש כאן פער שכדאי לסגור.";
}

function examNotes(cats) {
    const rows = EXAM_PLAN
        .filter((part) => cats[part.kind] && cats[part.kind].total > 0)
        .map((part) => {
            const row = cats[part.kind];
            const pct = row.right / row.total;
            return {
                kind: part.kind, label: part.label,
                right: row.right, total: row.total, pct: pct,
                lost: part.weight * (1 - pct),      // marks given up here
            };
        });
    if (rows.length === 0) return "אין מספיק נתונים למבחן הזה.";

    const score = Math.round(rows.reduce((sum, r) => sum + examCategoryMeta(r.kind).weight * r.pct, 0));
    if (score >= 100) return "מבחן מושלם — כל " + EXAM_TOTAL + " השאלות נכונות. אפשר להעלות קצב.";

    const parts = [examVerdict(score)];
    const lost = rows.filter((r) => r.lost > 0).sort((a, b) => b.lost - a.lost);
    const totalLost = Math.max(1, 100 - score);
    const worst = lost[0];

    if (worst) {
        const marks = Math.max(1, Math.round(worst.lost));
        const where = "ב" + worst.label + " (" + worst.right + " מתוך " + worst.total + ")";
        if (lost.length === 1) {
            parts.push(totalLost === 1
                ? "הנקודה היחידה שירדה היא " + where + "."
                : "כל " + totalLost + " הנקודות שירדו הן " + where + ".");
        } else {
            parts.push("הכי הרבה נקודות ירדו " + where + " — " +
                (marks === 1 ? "נקודה אחת" : marks + " נקודות") + " מתוך " + totalLost + ".");
        }
        parts.push(EXAM_TIPS[worst.kind] || "");
    }

    const clean = rows.filter((r) => r.pct >= 1).map((r) => r.label);
    if (clean.length && clean.length < rows.length) {
        parts.push("ללא טעות ב" + clean.join(", ") + ".");
    }
    return parts.filter(Boolean).join(" ");
}

    let streak = 0;
    for (let back = 0; back < 400; back++) {
        const day = new Date();
        day.setDate(day.getDate() - back);
        const entry = checklist[localDateKey(day)];
        const active = entry && Object.keys(entry).some((k) => entry[k]);
        if (active) { streak++; continue; }
        if (back === 0) continue;   // today may simply not have started yet
        break;
    }
    return streak;

/* The farewell mirrors the welcome, so signing out closes the same door the
   session opened. The wording is the booklet's own parting line. */
const FAREWELL_MS = 1800;
const PROMOTED_MS = 2200;

const SYNC_STAMP_KEY = "sync-updated-at";

/* Whichever copy was written last wins. The stamp is kept next to the local
   data, so a device that practised offline still uploads its work when it
   reconnects instead of being overwritten by an older cloud copy. */
function useCloudSync(user, state, setters) {
    const [status, setStatus] = useState("idle");   // idle | loading | synced | error
    const [detail, setDetail] = useState("");
    const ready = useRef(false);
    const docRef = useRef(null);
    const latest = useRef(state);
    latest.current = state;

    /* Firestore rejects an entire document if any field is undefined, and a word
       that has never been practised carries empty streak / dueAt / lastSeen keys.
       A round-trip through JSON drops those keys instead of sending them. */
    const stripUndefined = (value) => {
        try { return JSON.parse(JSON.stringify(value)); }
        catch (e) { return value; }
    };

    const push = (snapshot) => {
        if (!docRef.current) return Promise.resolve();
        const stamp = Date.now();
        const payload = stripUndefined({
            vocab: snapshot.vocab,
            letters: snapshot.letters,
            sentences: snapshot.sentences,
            idioms: snapshot.idioms,
            checklist: snapshot.checklist,
            exams: snapshot.exams,
            profile: snapshot.profile,
            updatedAt: stamp,
        });
        return docRef.current.set(payload, { merge: true })
            .then(() => {
                try { window.localStorage.setItem(SYNC_STAMP_KEY, String(stamp)); } catch (e) {}
                setStatus("synced");
            })
            .catch((err) => {
                setStatus("error");
                setDetail((err && (err.code || err.message)) || "שגיאה לא ידועה");
            });
    };

    useEffect(() => {
        ready.current = false;
        if (!user || !window.ZL_FIREBASE_READY) { docRef.current = null; setStatus("idle"); return; }
        docRef.current = firebase.firestore().collection("users").doc(user.uid);
        setStatus("loading");
        docRef.current.get().then((snap) => {
            const localStamp = Number(window.localStorage.getItem(SYNC_STAMP_KEY) || 0);
            const cloud = snap.exists ? snap.data() : null;
            if (cloud && Array.isArray(cloud.vocab) && (cloud.updatedAt || 0) >= localStamp) {
                setters.setVocab(mergeDefaults(cloud.vocab, DEFAULT_VOCAB));
                setters.setLetters(mergeDefaults(Array.isArray(cloud.letters) ? cloud.letters : [], ALPHABET));
                setters.setSentences(mergeDefaults(Array.isArray(cloud.sentences) ? cloud.sentences : [], SENTENCES));
                setters.setIdioms(mergeDefaults(Array.isArray(cloud.idioms) ? cloud.idioms : [], IDIOMS));
                if (cloud.checklist && typeof cloud.checklist === "object") setters.setChecklist(cloud.checklist);
                if (Array.isArray(cloud.exams)) setters.setExams(cloud.exams);
                if (cloud.profile && typeof cloud.profile === "object") setters.setProfile(cloud.profile);
                try { window.localStorage.setItem(SYNC_STAMP_KEY, String(cloud.updatedAt || Date.now())); } catch (e) {}
                setStatus("synced");
            } else {
                push(latest.current);   // first sign-in, or this device is ahead
            }
            ready.current = true;
        }).catch((err) => {
            setStatus("error");
            setDetail((err && (err.code || err.message)) || "שגיאה לא ידועה");
            ready.current = true;
        });
        // eslint-disable-next-line react-hooks/exhaustive-deps
    }, [user]);

    useEffect(() => {
        if (!user || !ready.current) return;
        const timer = setTimeout(() => push(latest.current), 1200);
        return () => clearTimeout(timer);
        // eslint-disable-next-line react-hooks/exhaustive-deps
    }, [state.vocab, state.letters, state.sentences, state.idioms, state.checklist, state.exams, state.profile, user]);

    return { status: status, detail: detail };
}

       boolean, which is what the week strip and the older stored days

                const need = plan.mode === "games" ? plan.games.length : 1;

    /* Shown after the personal area closes, so the congratulation lands on a

    const celebrateMeeting = (n) => {

    useEffect(() => {

    const startLogout = () => {
        setAccountOpen(false);

    };
    /* Five unbroken minutes without a touch, a key or a scroll ends the
       session.

       The clock is a timestamp rather than a countdown on purpose. A phone
       suspends timers the moment the tab goes to the background, so a plain
       setTimeout would simply stop counting while the app is away — and
       resetting it on return would treat "gone for an hour" as activity.

        const tick = setInterval(check, 15000);

                React.createElement("p", { style: { fontSize: "0.88rem", color: "var(--ink-muted)", lineHeight: 1.7 } },
                    "טעינת שירותי ההתחברות נכשלה. בדוק את החיבור לאינטרנט ורענן את הדף."))));
    }

            React.createElement(GlobalStyle, null),
            React.createElement(GreetingScreen, {

            })));
    }

    if (promoted !== null) {
        return (React.createElement("div", { className: "zl-root", "data-theme": theme },
            React.createElement(GlobalStyle, null),
            React.createElement(GreetingScreen, {
                headline: "מַבְּרוּכּ! אתה מתקדם בקצב טוב",
                note: "מפגש " + promoted + " נפתח — החומר החדש כבר בתרגול",
            })));
    }

    if (leaving) {
        return (React.createElement("div", { className: "zl-root", "data-theme": theme },
            React.createElement(GlobalStyle, null),
            React.createElement(GreetingScreen, {
                headline: "מַע (אל)סַّלַאמֵה!",
                note: "מתנתק…",
            })));
    }

    if (!user) {
        return React.createElement(LoginScreen, {
            theme: theme, onToggleTheme: toggleTheme,
            notice: idleOut ? "נותקת אוטומטית לאחר חמש דקות ללא פעילות" : null,
        });
    }

    const stillGreeting = showGreeting && !greetTimedOut && (!greetElapsed || settling);
    if (stillGreeting) {
        return (React.createElement("div", { className: "zl-root", "data-theme": theme },
            React.createElement(GlobalStyle, null),
            React.createElement(GreetingScreen, {
                headline: (profile && profile.name) ? "אַהְלַן יַא " + profile.name + "!" : "אַהְלַן!",
                note: "טוען את ההתקדמות שלך…",
            })));
    }

    return (React.createElement("div", {
            className: "zl-root", "data-theme": theme,
            /* Lets the stylesheet make room for the tour card. */
            "data-tour": guideOpen ? "true" : "false",
            style: { padding: "16px 16px 60px" },
        },
        React.createElement(GlobalStyle, null),
        /* Above everything, so it is the first thing a new account meets. */
        guideOpen ? React.createElement(GuideOverlay, {
            onClose: closeGuide,
            /* Drives the app behind the card: switches tab, and opens or

            onGoTo: (wantTab, wantAccount) => {

                if (wantAccount) setAccountPane(wantAccount);

        accountOpen ? React.createElement(AccountSheet, {
            vocab: vocab, letters: letters, sentences: sentences, idioms: idioms,
            checklist: checklist, exams: exams, profile: profile,
            setVocab: setVocab, setLetters: setLetters, setSentences: setSentences,
            setIdioms: setIdioms, setChecklist: setChecklist, setProfile: setProfile, setExams: setExams,
            user: user, syncStatus: sync, onClose: () => setAccountOpen(false),
            onLogout: startLogout,

            React.createElement("header", { className: "zl-appbar" },

                        title: theme === "dark" ? "מצב יום" : "מצב לילה",
                        "aria-label": theme === "dark" ? "מצב יום" : "מצב לילה",

                        React.createElement("h1", { className: "zl-brand-title zl-display" }, "לומדים ערבית"),

} catch (err) {
