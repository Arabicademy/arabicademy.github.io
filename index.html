/* =========================================================================
   PROGRESS HELPERS
   ========================================================================= */
/* =========================================================================
   SPACED REPETITION
   Each item carries its own next-review date. A correct answer pushes the
   review one rung further out along the ladder below; a wrong answer resets
   the ladder and brings the item back in this same session. The ladder tops
   out at two weeks on purpose — longer gaps feel like forgetting. Items that are due
   (or have never been seen) are what the practice queues serve first.
   ========================================================================= */
const DAY_MS = 86400000;
const SRS_LADDER = [1, 2, 4, 7, 10, 14];

function isDue(item) {
    return !item.dueAt || item.dueAt <= Date.now();
}

function dueCount(list) {
    return list.filter(isDue).length;
}

function scheduleNext(item, correct) {
    const streak = correct ? (item.streak || 0) + 1 : 0;
    const days = correct ? SRS_LADDER[Math.min(streak - 1, SRS_LADDER.length - 1)] : 0;
    return { streak: streak, dueAt: Date.now() + days * DAY_MS, lastSeen: Date.now() };
}

function dueLabel(item) {
    if (isDue(item)) return "לחזרה היום";
    const days = Math.ceil((item.dueAt - Date.now()) / DAY_MS);
    if (days <= 1) return "מחר";
    return "בעוד " + days + " ימים";
}

const MASTERY_TARGET = 6;
const netScore = (item) => Math.max(0, (item.correctCount || 0) - 0.5 * (item.wrongCount || 0));
const progressPct = (item) => Math.min(100, Math.round((netScore(item) / MASTERY_TARGET) * 100));
const isMastered = (item) => progressPct(item) >= 100;
const isStruggling = (item) => !isMastered(item) && (item.wrongCount || 0) >= 2 && progressPct(item) < 50;

function withProgressFields(list) {
    return list.map((i) => ({ correctCount: 0, wrongCount: 0, ...i }));
}

/* Every practice mode runs shuffled. The order is drawn fresh each pass, and
   weighted: an item you have been getting wrong is pulled toward the front,
   an item you have mastered drifts to the back. The random multiplier keeps
   two passes from ever looking the same. */
/* A word can carry more than one sense (אַמִין is a role and also a man's
   name). Practice picks one of them per card, so both get drilled; when
   checking a typed answer, every sense is accepted. */
function allMeanings(item) {
    return [item.back].concat(item.alts || []).filter(Boolean);
}

function pickMeaning(item) {
    const list = allMeanings(item);
    return list[Math.floor(Math.random() * list.length)];
}

function itemWeight(item) {
    const right = item.correctCount || 0;
    const wrong = item.wrongCount || 0;
    let weight = 1 + 1.6 * wrong - 0.45 * right;
    if (isMastered(item)) weight = Math.min(weight, 0.3);
    weight = Math.max(0.25, weight);
    if (!item.dueAt) return weight + 1.5;               // never reviewed — show it early
    const overdueDays = (Date.now() - item.dueAt) / DAY_MS;
    if (overdueDays < 0) return weight * 0.12;          // scheduled for a later day
    return weight + Math.min(3, overdueDays);           // the longer it is overdue, the higher
}

function weightedOrder(data) {
    return data
        .map((d, i) => ({ i: i, score: itemWeight(d) * (0.55 + Math.random() * 0.9) }))
        .sort((a, b) => b.score - a.score)
        .map((entry) => entry.i);
}

function shuffle(arr) {
    const a = [...arr];
    for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
}

/* FIX #3: items added to DEFAULT_VOCAB / ALPHABET after a user's first visit
   never appeared, because the saved copy in localStorage replaced the
   defaults wholesale. New default items are now merged in by id, while
   saved progress and user-created words are preserved. */
function mergeDefaults(stored, defaults) {
    if (!Array.isArray(stored)) return withProgressFields(defaults);
    // NOTE: this used to build the copies first and then Object.assign onto the
    // ORIGINAL stored objects, so new fields on the built-in items (topic, and
    // anything added later) never reached the list that was actually returned.
    const merged = stored.map((item) => ({ correctCount: 0, wrongCount: 0, ...item }));
    const byId = new Map(merged.map((item) => [item.id, item]));
    defaults.forEach((def) => {
        const existing = byId.get(def.id);
        if (!existing) {
            merged.push({ correctCount: 0, wrongCount: 0, ...def });
        } else {
            const keep = {
                correctCount: existing.correctCount || 0,
                wrongCount: existing.wrongCount || 0,
                streak: existing.streak,
                dueAt: existing.dueAt,
                lastSeen: existing.lastSeen,
            };
            Object.assign(existing, def, keep);
        }
    });
    return merged;
}

/* =========================================================================
   PERSISTENCE (localStorage)
   ========================================================================= */
function usePersistedState(key, initial, reviver) {
    const [state, setState] = useState(() => {
        try {
            const raw = window.localStorage.getItem(key);
            if (!raw) return initial;
            const parsed = JSON.parse(raw);
            return reviver ? reviver(parsed) : parsed;
        }
        catch (e) {
            return initial;
        }
    });
    useEffect(() => {
        try {
            window.localStorage.setItem(key, JSON.stringify(state));
        }
        catch (e) {
            /* storage unavailable — ignore */
        }
    }, [key, state]);
    return [state, setState];
}

function wordKey(text) {
    return String(text || "")
        .replace(/[\u0591-\u05C7\u0610-\u065F]/g, "")
        .replace(/[\s()'"\u2013\-,.\/]/g, "");
}

function initialVocab() {
    const base = withProgressFields(DEFAULT_VOCAB);
    const byKey = new Map(base.map((w) => [wordKey(w.front), w]));
    const retired = new Set(LEGACY_FRONTS.map(wordKey));
    let nextId = DEFAULT_VOCAB.reduce((m, w) => Math.max(m, w.id || 0), 0);
    const extraKeys = new Set();

    ["vocab-data-v4", "vocab-data-v3", "vocab-data-v2", "vocab-data"].forEach((key) => {
        let stored = null;
        try { stored = JSON.parse(window.localStorage.getItem(key) || "null"); }
        catch (e) { stored = null; }
        if (!Array.isArray(stored)) return;
        stored.forEach((w) => {
            if (!w || !w.front) return;
            const k = wordKey(w.front);
            const builtIn = byKey.get(k);
            if (builtIn) {
                // same word, keep whichever history is further along
                builtIn.correctCount = Math.max(builtIn.correctCount || 0, w.correctCount || 0);
                builtIn.wrongCount = Math.max(builtIn.wrongCount || 0, w.wrongCount || 0);
                if (w.streak) builtIn.streak = Math.max(builtIn.streak || 0, w.streak);
                if (w.dueAt) builtIn.dueAt = Math.max(builtIn.dueAt || 0, w.dueAt);
                return;
            }
            if (retired.has(k)) return;          // an old copy of a built-in word
            if (extraKeys.has(k)) return;
            extraKeys.add(k);
            nextId += 1;
            base.push({ correctCount: 0, wrongCount: 0, ...w, id: nextId, topic: w.topic || "מילים שלי" });
        });
    });
    return base;
}

/* The surah is rendered as one justified block. Both edges are flush on every
   line, and the type size is auto-fitted so the final line lands full-width
   instead of leaving a short "tail" — the fit re-runs on resize, orientation
   change and after the webfont loads, so it holds on any screen. */
const FATIHA_MIN_PX = 10;
const FATIHA_MAX_PX = 17;
const FATIHA_STEP_PX = 0.15;

function lastLineFill(el) {
    const range = document.createRange();
    range.selectNodeContents(el);
    const rects = Array.from(range.getClientRects()).filter((r) => r.width > 1 && r.height > 1);
    if (rects.length === 0) return { ratio: 1, lines: 1 };
    const lines = [];
    rects.forEach((r) => {
        const line = lines.find((l) => Math.abs(l.top - r.top) < 6);
        if (line) {
            line.left = Math.min(line.left, r.left);
            line.right = Math.max(line.right, r.right);
        } else {
            lines.push({ top: r.top, left: r.left, right: r.right });
        }
    });
    lines.sort((a, b) => a.top - b.top);
    const last = lines[lines.length - 1];
    const width = el.clientWidth || 1;
    return { ratio: Math.min(1, (last.right - last.left) / width), lines: lines.length };
}

function fitFatiha(el) {
    if (!el || !el.clientWidth) return;
    el.style.textAlignLast = "auto";
    let best = null;
    /* Search the whole size range rather than stopping at the first decent
       result: on a wide screen only a few sizes make the final line land near
       the edge, and those are what keep the block rectangular. */
    for (let px = FATIHA_MAX_PX; px >= FATIHA_MIN_PX - 0.001; px -= FATIHA_STEP_PX) {
        el.style.fontSize = px.toFixed(2) + "px";
        const measured = lastLineFill(el);
        if (measured.lines === 1) {
            if (!best) best = { px: px, ratio: 1, lines: 1 };
            continue;
        }
        if (!best || best.lines === 1 || measured.ratio > best.ratio + 0.003) {
            best = { px: px, ratio: measured.ratio, lines: measured.lines };
        }
        if (measured.ratio >= 0.985) break;
    }
    el.style.fontSize = (best ? best.px.toFixed(2) : "14") + "px";
    // stretch the last line only when it is already close to the edge
    const worthJustifying = best && best.lines > 1 && best.ratio >= 0.7;
    el.style.textAlignLast = worthJustifying ? "justify" : "right";
}

const AlFatihaCard = () => {
    const bodyRef = useRef(null);
    useEffect(() => {
        const el = bodyRef.current;
        if (!el) return;
        let frame = null;
        const run = () => {
            if (frame) cancelAnimationFrame(frame);
            frame = requestAnimationFrame(() => fitFatiha(el));
        };
        run();
        if (document.fonts && document.fonts.ready && document.fonts.ready.then) {
            document.fonts.ready.then(run).catch(() => {});
        }
        let observer = null;
        if (typeof ResizeObserver !== "undefined") {
            observer = new ResizeObserver(run);
            observer.observe(el);
        } else {
            window.addEventListener("resize", run);
        }

/* FIX #5: the date key used toISOString(), which is UTC. Between 00:00 and
   03:00 Israel time the checklist jumped back to the previous day's boxes.
   The key is now built from the local date. */
function localDateKey(d) {
    const dt = d || new Date();
    const pad = (n) => String(n).padStart(2, "0");
    return dt.getFullYear() + "-" + pad(dt.getMonth() + 1) + "-" + pad(dt.getDate());
}

/* The seven days ending today, with how many of the three daily tasks were
   ticked on each. Read straight out of the checklist that is already stored. */
function lastSevenDays(checklist, weeksBack) {
    const names = ["א", "ב", "ג", "ד", "ה", "ו", "ש"];
    const shift = (weeksBack || 0) * 7;
    const days = [];
    for (let back = 6; back >= 0; back--) {
        const date = new Date();
        date.setDate(date.getDate() - back - shift);
        const key = localDateKey(date);
        const entry = checklist[key] || {};
        const doneKeys = Object.keys(entry).filter((k) => entry[k]);
        days.push({
            key: key,
            name: names[date.getDay()],
            date: date.getDate() + "." + (date.getMonth() + 1),
            done: doneKeys.length,
            doneKeys: doneKeys,
            today: back === 0 && !shift,
        });
    }
    return days;
}

function routineStreak(checklist) {
    let streak = 0;
    for (let back = 0; back < 400; back++) {
        const day = new Date();
        day.setDate(day.getDate() - back);
        const entry = checklist[localDateKey(day)];
        const active = entry && Object.keys(entry).some((k) => entry[k]);
        if (active) { streak++; continue; }
        if (back === 0) continue;   // today may simply not have started yet
        break;
    }
    return streak;
}
