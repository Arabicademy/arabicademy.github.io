<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>תרגול ערבית - Shadowing וקריאה</title>
    <style>
        :root {
            --primary-color: #2c3e50;
            --accent-color: #3498db;
            --bg-color: #f8f9fa;
            --card-bg: #ffffff;
            --text-color: #333333;
            --border-color: #e2e8f0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            direction: rtl;
        }

        .container {
            max-width: 950px;
            margin: 0 auto;
            background: var(--card-bg);
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }

        h1 {
            text-align: center;
            color: var(--primary-color);
            margin-bottom: 25px;
        }

        /* ניווט בלשוניות ראשיות */
        .main-tabs {
            display: flex;
            border-bottom: 2px solid var(--border-color);
            margin-bottom: 20px;
        }

        .main-tab-btn {
            padding: 12px 24px;
            cursor: pointer;
            border: none;
            background: none;
            font-size: 16px;
            font-weight: bold;
            color: #7f8c8d;
            border-bottom: 3px solid transparent;
            transition: all 0.3s ease;
        }

        .main-tab-btn.active {
            color: var(--accent-color);
            border-bottom-color: var(--accent-color);
        }

        /* ניווט בלשוניות משנה (Shadowing Sub-tabs) */
        .sub-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .sub-tab-btn {
            padding: 8px 16px;
            cursor: pointer;
            border: 1px solid var(--border-color);
            background: #fff;
            border-radius: 20px;
            font-size: 14px;
            transition: all 0.2s ease;
        }

        .sub-tab-btn.active {
            background: var(--accent-color);
            color: white;
            border-color: var(--accent-color);
        }

        /* עיצוב נגן שמע מרכזי */
        .audio-player-container {
            background: #f1f5f9;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .audio-player-container span {
            font-weight: bold;
            color: var(--primary-color);
        }

        audio {
            max-width: 300px;
        }

        /* עיצוב טבלאות */
        .data-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }

        .data-table th, .data-table td {
            padding: 12px 15px;
            text-align: right;
            border-bottom: 1px solid var(--border-color);
        }

        .data-table th {
            background-color: #f1f5f9;
            color: var(--primary-color);
        }

        .data-table tr:hover {
            background-color: #f8fafc;
        }

        .arabic-text {
            font-size: 1.15em;
            font-weight: 600;
            color: #2c3e50;
        }

        .num-col {
            width: 40px;
            color: #888;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>מערכת תרגול ערבית</h1>

    <!-- לשוניות ראשיות -->
    <div class="main-tabs">
        <button class="main-tab-btn active" onclick="switchMainTab(event, 'practice-methods')">תרגול שיטות (Shadowing)</button>
        <button class="main-tab-btn" onclick="switchMainTab(event, 'reading-section')">קריאה (פתגמים וביטויים)</button>

    </div>

    <!-- תוכן טאב "תרגול שיטות" -->
    <div id="practice-methods" class="tab-content active">

        <div class="sub-tabs">

    <div id="reading-section" class="tab-content">

    <!-- תוכן טאב "כלים נוספים" -->
    <div id="other-tools" class="tab-content">
        <h2>כלים נוספים</h2>
        <p>תוכן נוסף יתווסף כאן בעתיד.</p>
    </div>
</div>

    // מעבר בין לשוניות ראשיות
    function switchMainTab(event, tabId) {
        document.querySelectorAll('.main-tab-btn').forEach(btn => btn.classList.remove('active'));
        document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
        
        event.target.classList.add('active');
        document.getElementById(tabId).classList.add('active');
    }

    // מעבר בין תתי-לשוניות בתוך שאדואינג
    function switchSubTab(event, subTabKey) {
        document.querySelectorAll('.sub-tab-btn').forEach(btn => btn.classList.remove('active'));
        event.target.classList.add('active');

        renderShadowingData(subTabKey);
    }

    // טעינת הנתונים לטבלת השאדואינג
    function renderShadowingData(subTabKey) {
        const categoryData = shadowingData[subTabKey];
        const tableBody = document.getElementById('shadowing-table-body');
        const audioLabel = document.getElementById('current-audio-label');
        const audioPlayer = document.getElementById('main-audio-player');
        const audioSource = document.getElementById('audio-source');

        audioLabel.textContent = `קובץ שמע: ${categoryData.audioFile}`;
        audioSource.src = categoryData.audioFile;
        audioPlayer.load();

        tableBody.innerHTML = '';
        categoryData.items.forEach(item => {
            const row = document.createElement('tr');
            row.innerHTML = `
                <td class="num-col">${item.num}</td>
                <td class="arabic-text">${item.arabic}</td>
                <td>${item.hebrew}</td>
            `;
            tableBody.appendChild(row);
        });
    }

    // טעינת הנתונים לטבלת הקריאה
    function renderReadingData() {
        const tableBody = document.getElementById('reading-table-body');
        tableBody.innerHTML = '';
        readingData.forEach(item => {
            const row = document.createElement('tr');
            row.innerHTML = `
                <td class="num-col">${item.num}</td>
                <td class="arabic-text">${item.arabic}</td>
                <td>${item.literal}</td>
                <td>${item.meaning}</td>
            `;
            tableBody.appendChild(row);
        });
    }

    // טעינה ראשונית עם עליית הדף
