/* =========================================================================
   FULL EXAM
   Thirty-one questions drawn from all four banks. Categories are not worth
   the same: producing a whole sentence exercises vocabulary *and* syntax,
   while naming a letter is recall of a label — so the weights below decide
   the final mark rather than a raw count of right answers.

   The exam only measures. It deliberately does not touch the review
   schedule, so sitting an exam cannot disturb the spacing of your practice.
   ========================================================================= */
/* How long the exam runs.

   A single meeting is thirty-one questions, about ten minutes. Each meeting
   opened adds material, so the exam lengthens — but the growth tapers, or by
   meeting fifteen it would be an afternoon's work. The ceiling is set so the
   longest exam stays inside half an hour at the twenty seconds a question
   this one actually takes.

   The mix between meetings is the same halving used everywhere else: the
   current meeting carries most of the paper, the one before it half of that,
   and so on. */
const EXAM_MIN = 31;
const EXAM_MAX = 90;

function examLength(openMeetings) {
    if (openMeetings <= 1) return EXAM_MIN;
    /* Square-root growth: doubling the course does not double the exam. */
    const grown = Math.round(EXAM_MIN * Math.sqrt(openMeetings));
    return Math.min(EXAM_MAX, grown);
}

/* `grows` decides whether a category scales with the course.

   The alphabet and the idioms do not: they were fixed at the start and stay
   the same size however far the course runs. Letting them grow meant that by
   meeting five they filled more than a third of the paper and squeezed the
   current meeting down to a third — the opposite of what an exam should
   weight. Idioms are marginal enough to be a single question, and often
   none. */
/* Weight has to bear some relation to how many questions carry it. Idioms
   were one question worth twelve points — four times what a vocabulary
   question was worth, and more than the whole alphabet section. A single
   wrong idiom cost more than five wrong words, which is not what the section
   is for. Three points puts one idiom in the same range as one word, and the
   nine points it gives up go back to the two sections that actually grow
   with the course, in the proportion they already had.

   It also settles a second problem: the idiom question is drawn only
   sometimes, and when it is missing its weight is shared out. At twelve
   points that meant the same answers could score differently from one sitting
   to the next; at three the difference is small enough not to matter. */
const EXAM_PLAN = [
    { kind: "vocab", deck: "vocab", count: 15, weight: 56, label: "אוצר מילים", grows: true },
    { kind: "sentence", deck: "sentences", count: 5, weight: 33, label: "הרכבת משפטים", grows: true },
    { kind: "idiom", deck: "idioms", count: 1, weight: 3, label: "ניבי לשון", grows: false, sometimes: true },
    { kind: "letter", deck: "letters", count: 8, weight: 8, label: "אלף-בית", grows: false },
];
const EXAM_TOTAL = 31;

/* Numbers are not in EXAM_PLAN — their share is worked out from how well the
   bands are known, not fixed in advance — so their label is supplied here. */
const EXAM_NUMBER_META = { kind: "number", label: "מספרים", weight: 10, count: 1 };

function examCategoryMeta(kind) {
    if (kind === "number") return EXAM_NUMBER_META;
    return EXAM_PLAN.filter((p) => p.kind === kind)[0] || { label: kind, weight: 0, count: 1 };
}

/* Draw a fresh set of tasks. Items are chosen by the same weighting the
   practice queues use, so a shaky word is likelier to be tested, and the
   order is shuffled so no two exams feel alike. */
/* "ב..." normalises down to a single letter — there is nothing to type and
   nothing to judge. Words like that are always asked as multiple choice. */
function isTypeable(item) {
    return allMeanings(item).some((m) => normAnswer(m).length >= 2);
}

/* How much of the exam goes to numbers.

   They belong to no meeting, so they cannot ride the meeting split. A tenth
   of the paper while they are still being learned, tapering to almost
   nothing once the bands are solid — there is no reason to keep testing what
   is known, and every question spent there is one not spent on the meeting. */
function numberShare(profile) {
    const known = numbersKnowledge(profile) / 100;
    return 0.10 - (0.07 * known);      // 10% down to 3%
}

function buildNumberExamTasks(count, profile) {
    const out = [];
    /* Weighted towards the bands that are least known, so the exam asks about
       what is shaky rather than sampling evenly. */
    const stats = (profile && profile.numberStats) || {};
    const weakest = NUM_BANDS.slice()
        .sort((a, b) => bandScore(stats, a.key) - bandScore(stats, b.key));
    for (let i = 0; i < count; i++) {
        /* Drawn rather than taken in order: cycling through the three weakest
           meant that when every band read zero — which is where everyone
           starts — the same three were asked every time and the ordinals were
           never reached at all. */
        const pool = Math.random() < 0.7 ? weakest.slice(0, 3) : weakest;
        const band = pool[Math.floor(Math.random() * pool.length)];
        if (band.key === "ordinals") {
            const task = buildOrdinalTask();
            out.push({ kind: "number", numberKind: "ordinal", task: task, band: "ordinals" });
        } else {
            const pool = { ones: 10, teens: 19, tens: 90, hundreds: 900, composed: 999 }[band.key] || 999;
            let n = 1 + Math.floor(Math.random() * pool);
            if (band.key === "teens") n = 11 + Math.floor(Math.random() * 9);
            if (band.key === "tens") n = (2 + Math.floor(Math.random() * 8)) * 10;
            if (band.key === "hundreds") n = (1 + Math.floor(Math.random() * 9)) * 100;
            if (band.key === "composed") { n = 21 + Math.floor(Math.random() * 978); if (n % 10 === 0) n += 1; }
            out.push({ kind: "number", numberKind: "digits", value: n, band: numberBand(n) });
        }
    }
    return out;
}

function buildExamTasks(banks, profile) {
    const tasks = [];
    /* Every category scales together, so the weighting between them is
       unchanged however long the paper gets. */
    /* The fixed categories keep their original size, so the whole of the
       growth belongs to vocabulary and sentences. Scaling everything by the
       same factor would both shorten the paper and leave the alphabet taking
       a third of it. */
    /* Numbers take their share of the paper rather than lengthening it: the
       exam is already pitched at half an hour, and adding to it would push
       past that every time the share rose. */
    const length = examLength(banks.meeting || 1);
    const numberCount = Math.round(length * numberShare(profile));
    const fixed = EXAM_PLAN.filter((p) => !p.grows).reduce((n, p) => n + p.count, 0);
    const growing = EXAM_TOTAL - fixed;
    const grow = (length - numberCount - fixed) / growing;
    EXAM_PLAN.forEach((part) => {
        /* The exam asks sentences by assembly, so it draws from the same
           subset the assembly drill uses. */
        const deck = part.kind === "sentence"
            ? buildDeck(part.deck, banks).filter(isAssemblable)
            : buildDeck(part.deck, banks);
        if (deck.length === 0) return;
        /* Only the growing categories take the multiplier; the fixed ones
           keep their original size so the added questions all go to the
           material actually being studied. An idiom appears about half the
           time — one question either way is noise. */
        if (part.sometimes && Math.random() < 0.5) return;
        const scale = part.grows ? grow : 1;
        const want = Math.min(Math.round(part.count * scale), deck.length);
        /* Composed rather than merely weighted, so the current meeting fills
           most of the paper just as it fills most of the practice. */
        const picked = composeSession(deck, banks.meeting, want).map((i) => deck[i]);
        picked.forEach((item, idx) => {
            const dir = resolveDir("mix");
            if (part.kind === "sentence") {
                tasks.push({ kind: "sentence", item: item, dir: dir });
            } else if (part.kind === "vocab") {
                /* Half the word questions are typed rather than picked. Typing is
                   only ever asked when the prompt is Arabic, so the answer stays
                   in Hebrew and the keyboard never has to switch. */
                const open = idx % 2 === 1 && dir === "ar2he" && isTypeable(item);
                tasks.push({ kind: "vocab", item: item, dir: dir, open: open, question: buildQuestion(deck, item, dir) });
            } else {
                tasks.push({ kind: part.kind, item: item, dir: dir, question: buildQuestion(deck, item, dir) });
            }
        });
    });
    /* The numbers go in last, so their count is not reduced by a category
       that ran short of cards. */
    if (numberCount > 0) {
        buildNumberExamTasks(numberCount, profile).forEach((t) => tasks.push(t));
    }
    return shuffle(tasks);
}

/* A short read on the result, built from the per-category scores. */
/* A short read on the result.

   The bars above it already show how many questions were right in each
   category, so repeating that adds nothing. What the bars cannot show is
   where the *marks* went: the categories are weighted, so one missed sentence
   costs six points while a missed letter costs one. 14/15 on vocabulary is a
   bigger dent than 7/8 on letters, and nobody works that out in their head.
   That is what this paragraph is for. */
const EXAM_TIPS = {
    vocab: "סבב כרטיסיות יומי הוא הדרך המהירה לסגור את זה.",
    sentence: "תרגול הרכבת משפטים בכיוון עברית ← ערבית מטפל בזה ישירות.",
    idiom: "הניבים הם הקטגוריה הקטנה — כמה סבבים קצרים והם נסגרים.",
    letter: "סבב כרטיסיות אותיות של חמש דקות בדרך כלל מספיק.",
};

function examVerdict(score) {
    if (score >= 90) return "תוצאה מצוינת.";
    if (score >= 75) return "תוצאה טובה.";
    if (score >= 60) return "תוצאה סבירה.";
    return "יש כאן פער שכדאי לסגור.";
}

function examNotes(cats) {
    const rows = EXAM_PLAN
        .filter((part) => cats[part.kind] && cats[part.kind].total > 0)
        .map((part) => {
            const row = cats[part.kind];
            const pct = row.right / row.total;
            return {
                kind: part.kind, label: part.label,
                right: row.right, total: row.total, pct: pct,
                lost: part.weight * (1 - pct),      // marks given up here
            };
        });
    if (rows.length === 0) return "אין מספיק נתונים למבחן הזה.";

    const score = Math.round(rows.reduce((sum, r) => sum + examCategoryMeta(r.kind).weight * r.pct, 0));
    if (score >= 100) return "מבחן מושלם — כל " + EXAM_TOTAL + " השאלות נכונות. אפשר להעלות קצב.";

    const parts = [examVerdict(score)];
    const lost = rows.filter((r) => r.lost > 0).sort((a, b) => b.lost - a.lost);
    const totalLost = Math.max(1, 100 - score);
    const worst = lost[0];

    if (worst) {
        const marks = Math.max(1, Math.round(worst.lost));
        const where = "ב" + worst.label + " (" + worst.right + " מתוך " + worst.total + ")";
        if (lost.length === 1) {
            parts.push(totalLost === 1
                ? "הנקודה היחידה שירדה היא " + where + "."
                : "כל " + totalLost + " הנקודות שירדו הן " + where + ".");
        } else {
            parts.push("הכי הרבה נקודות ירדו " + where + " — " +
                (marks === 1 ? "נקודה אחת" : marks + " נקודות") + " מתוך " + totalLost + ".");
        }
        parts.push(EXAM_TIPS[worst.kind] || "");
    }

    const clean = rows.filter((r) => r.pct >= 1).map((r) => r.label);
    if (clean.length && clean.length < rows.length) {
        parts.push("ללא טעות ב" + clean.join(", ") + ".");
    }
    return parts.filter(Boolean).join(" ");
}

function FullExam({ banks, profile, onBack, onExamStart, onExamFinish, applyResult, onNumberResult, onSessionDone }) {

    const [pos, setPos] = useState(0);

        });

           evidence — but it passes schedule=false so the review dates stay
           exactly where the practice sessions left them. */

    const giveUp = () => { if (!result) record(false); };

    const submitTyped = () => {
        if (result || !typed.trim()) return;
        if (task.kind === "number") {
            record(parseInt(typed.trim(), 10) === task.value);
            return;

        const accepted = new Set();
        allMeanings(task.item).forEach((sense) => acceptableAnswers(sense).forEach((k) => accepted.add(k)));
        record(accepted.has(normAnswer(typed)));

    const finish = (finalCats) => {
        let earned = 0;
        EXAM_PLAN.forEach((part) => {
            const row = finalCats[part.kind];
            if (row && row.total > 0) earned += part.weight * (row.right / row.total);
        });

        settledRef.current = true;
        onExamFinish(examIdRef.current, { score: score, cats: finalCats, aborted: false, questions: tasks.length });

           the app and showed as never attempted. */
        if (onSessionDone) {

            const asked = Object.keys(finalCats).reduce((n, k) => n + finalCats[k].total, 0);
            if (asked > 0) onSessionDone({ mode: "exam", right: right, total: asked });

        setFinished(true);
    };

            setTyped("");
            setResult(null);
        }

            React.createElement(BackLink, { onClick: onBack }, "חזרה לשיטות תרגול"),
            React.createElement(Card, null,
                React.createElement("div", { className: "zl-score", "data-fail": score < 60 ? "true" : "false" },
                    React.createElement("span", { className: "zl-score-num" }, score),
                    React.createElement("span", { className: "zl-score-of" }, "מתוך 100")),
                React.createElement("h2", { className: "zl-display", style: { fontSize: "1.25rem", fontWeight: 800, textAlign: "center", marginBottom: 16 } }, "סיימת את המבחן"),

/* The farewell mirrors the welcome, so signing out closes the same door the
   session opened. The wording is the booklet's own parting line. */
const FAREWELL_MS = 1800;
const PROMOTED_MS = 2200;

const SYNC_STAMP_KEY = "sync-updated-at";

/* Whichever copy was written last wins. The stamp is kept next to the local
   data, so a device that practised offline still uploads its work when it
   reconnects instead of being overwritten by an older cloud copy. */
function useCloudSync(user, state, setters) {
    const [status, setStatus] = useState("idle");   // idle | loading | synced | error
    const [detail, setDetail] = useState("");
    const ready = useRef(false);
    const docRef = useRef(null);
    const latest = useRef(state);
    latest.current = state;

    /* Firestore rejects an entire document if any field is undefined, and a word
       that has never been practised carries empty streak / dueAt / lastSeen keys.
       A round-trip through JSON drops those keys instead of sending them. */
    const stripUndefined = (value) => {
        try { return JSON.parse(JSON.stringify(value)); }
        catch (e) { return value; }
    };

    const push = (snapshot) => {
        if (!docRef.current) return Promise.resolve();
        const stamp = Date.now();
        const payload = stripUndefined({
            vocab: snapshot.vocab,
            letters: snapshot.letters,
            sentences: snapshot.sentences,
            idioms: snapshot.idioms,
            checklist: snapshot.checklist,
            exams: snapshot.exams,
            profile: snapshot.profile,
            updatedAt: stamp,
        });
        return docRef.current.set(payload, { merge: true })
            .then(() => {
                try { window.localStorage.setItem(SYNC_STAMP_KEY, String(stamp)); } catch (e) {}
                setStatus("synced");
            })
            .catch((err) => {
                setStatus("error");
                setDetail((err && (err.code || err.message)) || "שגיאה לא ידועה");
            });
    };

    useEffect(() => {
        ready.current = false;
        if (!user || !window.ZL_FIREBASE_READY) { docRef.current = null; setStatus("idle"); return; }
        docRef.current = firebase.firestore().collection("users").doc(user.uid);
        setStatus("loading");
        docRef.current.get().then((snap) => {
            const localStamp = Number(window.localStorage.getItem(SYNC_STAMP_KEY) || 0);
            const cloud = snap.exists ? snap.data() : null;
            if (cloud && Array.isArray(cloud.vocab) && (cloud.updatedAt || 0) >= localStamp) {
                setters.setVocab(mergeDefaults(cloud.vocab, DEFAULT_VOCAB));
                setters.setLetters(mergeDefaults(Array.isArray(cloud.letters) ? cloud.letters : [], ALPHABET));
                setters.setSentences(mergeDefaults(Array.isArray(cloud.sentences) ? cloud.sentences : [], SENTENCES));
                setters.setIdioms(mergeDefaults(Array.isArray(cloud.idioms) ? cloud.idioms : [], IDIOMS));
                if (cloud.checklist && typeof cloud.checklist === "object") setters.setChecklist(cloud.checklist);
                if (Array.isArray(cloud.exams)) setters.setExams(cloud.exams);
                if (cloud.profile && typeof cloud.profile === "object") setters.setProfile(cloud.profile);
                try { window.localStorage.setItem(SYNC_STAMP_KEY, String(cloud.updatedAt || Date.now())); } catch (e) {}
                setStatus("synced");
            } else {
                push(latest.current);   // first sign-in, or this device is ahead
            }
            ready.current = true;
        }).catch((err) => {
            setStatus("error");
            setDetail((err && (err.code || err.message)) || "שגיאה לא ידועה");
            ready.current = true;
        });
        // eslint-disable-next-line react-hooks/exhaustive-deps
    }, [user]);

    useEffect(() => {
        if (!user || !ready.current) return;
        const timer = setTimeout(() => push(latest.current), 1200);
        return () => clearTimeout(timer);
        // eslint-disable-next-line react-hooks/exhaustive-deps
    }, [state.vocab, state.letters, state.sentences, state.idioms, state.checklist, state.exams, state.profile, user]);

    return { status: status, detail: detail };
}
