<style>
  /* The first-paint screen. It repeats a little of the app's styling on
     purpose: this markup has to stand on its own before any stylesheet the
     application injects exists. */
  @font-face { font-family: 'HeeboBoot'; src: local('Heebo'); }
  html { background: #EFEBE3; }
  html:has(.zl-root[data-theme="dark"]) { background: #0A0A0A; }
  body { margin: 0; background: transparent; }
  body:has(.zl-boot[data-dark="true"]) { background: #0A0A0A; }
  .zl-boot[data-dark="true"] {
    background:
      radial-gradient(120% 90% at 50% 0%, rgba(166,156,138,0.14) 0%, rgba(10,10,10,0) 62%),
      linear-gradient(165deg, #1A1A1A 0%, #0A0A0A 55%, #000 100%);
  }
  .zl-boot {
    position: fixed; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 22px; padding: 28px; text-align: center;
    font-family: 'Heebo', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background:
      radial-gradient(120% 90% at 50% 0%, rgba(166,156,138,0.22) 0%, rgba(239,235,227,0) 62%),
      linear-gradient(165deg, #F6F3EC 0%, #EFEBE3 55%, #E4DFD3 100%);
  }
  @keyframes zl-boot-rise { from { opacity:0; transform:translateY(12px) scale(0.97);} to { opacity:1; transform:none;} }
  .zl-boot-logo { width: min(190px, 48vw); animation: zl-boot-rise .5s ease both; }
  .zl-boot-rule { width: 70px; height: 3px; background: #5A1016; border-radius: 2px; animation: zl-boot-rise .5s ease .12s both; }
  .zl-boot-hi {
    font-size: clamp(1.5rem, 6vw, 2.1rem); font-weight: 800; color: #0A0A0A;
    line-height: 1.5; margin: 0; animation: zl-boot-rise .5s ease .2s both;
  }
  .zl-boot-note { font-size: 0.8rem; color: rgba(10,10,10,0.62); margin: 0; animation: zl-boot-rise .5s ease .28s both; }
  .zl-boot[data-dark="true"] .zl-boot-hi { color: #EFEBE3; }
  .zl-boot[data-dark="true"] .zl-boot-note { color: rgba(239,235,227,0.62); }
  .zl-boot[data-dark="true"] .zl-boot-rule { background: #9E2630; }
  @media (prefers-reduced-motion: reduce) {
    .zl-boot-logo, .zl-boot-rule, .zl-boot-hi, .zl-boot-note { animation: none; }
  }

  #boot-error {
    display: none;
    direction: ltr;
    text-align: left;
    font-family: monospace;
    white-space: pre-wrap;
    word-break: break-all;
    overflow-wrap: anywhere;
    background: #fee2e2;
    color: #7f1d1d;
    border: 2px solid #dc2626;
    padding: 16px;
    margin: 16px;
    border-radius: 8px;
    font-size: 13px;
    line-height: 1.5;
  }
</style>
</head>

<script>
  function showBootError(title, err) {
    var box = document.getElementById('boot-error');
    box.style.display = 'block';
    var name = (err && err.name) ? err.name : 'Error';
    var message = (err && err.message) ? err.message : String(err);
    var stack = (err && err.stack) ? err.stack : '';
    box.textContent =
      title + '\n\n' +
      name + ': ' + message + '\n\n' +
      '--- stack ---\n' + stack;
  }
  window.addEventListener('error', function (e) {
    showBootError('שגיאת JavaScript:', e.error || e.message);
  });
  window.addEventListener('unhandledrejection', function (e) {
    showBootError('שגיאה לא מטופלת:', e.reason);
  });
</script>

/* =========================================================================
   FONTS / GLOBAL STYLE INJECTION
   FIX #1: the stylesheet used to be built with .join("\\n"), which put a
   literal backslash-n between every CSS line. In CSS a backslash escapes the
   next character, so "}\nzl-root" collapsed to "}n.zl-root" and every rule
   after the first was silently dropped. It is now a plain template string.
   ========================================================================= */
const GLOBAL_CSS = `
    @import url('https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800;900&family=Noto+Naskh+Arabic:wght@500;700&display=swap');

    /* ---------------------------------------------------------------
       Palette taken from the institute logo: deep navy, white, and the
       red of the target emblem. Red is reserved for two jobs only —
       decorative hairlines (as under the logo wordmark) and anything
       wrong or overdue. Progress and mastery run along the blue scale,
       so a red mark on screen always means "look here".
       --------------------------------------------------------------- */
    /* Off-screen rows cost layout on every scroll frame; the browser may skip
       them. Only the statistics rows carry a class of their own — the cards
       are styled inline — so this is where it applies. */
    .zl-catrow {
      content-visibility:auto;
      contain-intrinsic-size:auto 44px;
    }
    /* backdrop-filter on a floating element forces a repaint per frame on iOS */
    @supports (-webkit-touch-callout: none) {
      .zl-iconbtn { backdrop-filter:none; }
    }
    .zl-root {
      /* iPhone draws the page edge to edge under the status bar and the home
         indicator once the viewport says viewport-fit=cover. These keep the
         content out from under both. They are zero on hardware without a
         notch, so nothing else moves. */
      padding-top:env(safe-area-inset-top, 0px);
      padding-bottom:env(safe-area-inset-bottom, 0px);
      padding-left:env(safe-area-inset-left, 0px);
      padding-right:env(safe-area-inset-right, 0px);
      box-sizing:border-box;
      /* Kasba's three colours: charcoal #0A0A0A, aged bone #A69C8A and deep
         wine #5A1016. Everything on the page is one of those three or a tint
         of them, so the app and the mark read as one object. Wine is the
         scarce one — it marks a single thing at a time, the way the stamp
         carries a single red dot. */
      --navy:#0A0A0A;          /* primary: headings, solid buttons */
      --navy-800:#232323;
      --ok:#6E6656;            /* mastered / correct */
      --focus:#8A8071;         /* in progress, focus ring */
      --bg:#EFEBE3;            /* page — bone, lifted for long reading */
      --surface:#FAF8F3;       /* card, a shade above the page */
      --line:#D6CFC0;          /* hairlines and borders */
      --accent:#5A1016;        /* wine */
      --accent-soft:#E6D2D3;
      --bad:#5A1016;           /* wrong / danger — the same wine */
      --bad-bg:#F2E3E3;
      --ok-bg:#E8E3D8;
      --ink:#0A0A0A;
      --ink-muted:#6E6656;
      /* The header band and the Fatiha strip. Light sits on bone with
         charcoal type; dark sits on charcoal with bone type. */
      --band:linear-gradient(160deg, #F7F4EE 0%, #EFEBE3 60%, #E6E0D4 100%);
      --band-ink:#0A0A0A;
      --band-ink-soft:rgba(10,10,10,0.62);
      --band-line:rgba(10,10,10,0.14);
      --band-wash:rgba(10,10,10,0.04);
      --shadow-sm:0 1px 2px rgba(10,10,10,0.06), 0 2px 6px rgba(10,10,10,0.05);
      --shadow-md:0 2px 4px rgba(10,10,10,0.07), 0 8px 20px rgba(10,10,10,0.09);
      --shadow-lg:0 18px 45px rgba(10,10,10,0.26);
      --r-sm:8px; --r-md:12px; --r-lg:16px; --r-xl:20px;
      font-family:'Heebo','Noto Naskh Arabic',sans-serif;
      background:var(--bg);
      color:var(--ink);
      min-height:100vh;
      direction:rtl;
    }
    .zl-root * { box-sizing:border-box; }
    .zl-display { font-family:'Heebo','Noto Naskh Arabic',sans-serif; }
    .zl-arabic { font-family:'Noto Naskh Arabic',serif; }

    .zl-scrollbar::-webkit-scrollbar { height:6px; width:6px; }
    .zl-scrollbar::-webkit-scrollbar-thumb { background:var(--line); border-radius:3px; }

    .zl-root button:focus-visible,
    .zl-root input:focus-visible { outline:2px solid var(--focus); outline-offset:2px; }

    @keyframes zl-fade { from { opacity:0; transform:translateY(4px);} to { opacity:1; transform:translateY(0);} }
    .zl-anim { animation: zl-fade 0.2s ease; }

    /* ---- night mode ---- */
    .zl-root[data-theme="dark"] {
      /* The inverse stamp: ivory on charcoal, same red. */
      --navy:#A69C8A;
      --navy-800:#C2B9A9;
      --ok:#8A8071;
      --focus:#A69C8A;
      --bg:#0A0A0A;
      --surface:#161616;
      --line:#2B2926;
      --accent:#9E2630;       /* wine, lifted so it reads on charcoal */
      --accent-soft:#3A1014;
      --bad:#9E2630;
      --bad-bg:#2E1013;
      --ok-bg:#1E1C19;
      --ink:#EFEBE3;
      --ink-muted:#8A8071;
      --band:linear-gradient(160deg, #1A1A1A 0%, #0A0A0A 60%, #000 100%);
      --band-ink:#EFEBE3;
      --band-ink-soft:rgba(239,235,227,0.62);
      --band-line:rgba(239,235,227,0.16);
      --band-wash:rgba(239,235,227,0.06);
      --shadow-sm:0 1px 2px rgba(0,0,0,0.35);
      --shadow-md:0 2px 4px rgba(0,0,0,0.3), 0 8px 22px rgba(0,0,0,0.35);
      --shadow-lg:0 18px 45px rgba(0,0,0,0.55);
    }
    .zl-root[data-theme="dark"] .zl-day[data-on="true"] { background:rgba(166,156,138,0.14); border-color:rgba(166,156,138,0.38); }

    /* ---- header band ----
       The masthead is a solid navy panel so the logo sits on the colour it
       was drawn for, and the page gets a real top edge instead of floating
       text. The corner controls live inside it. */
    .zl-appbar {
      position:relative;
      background:var(--band);
      border-radius:var(--r-lg);
      padding:20px 22px 18px;
      margin-bottom:22px;
      box-shadow:var(--shadow-md);
      overflow:hidden;
    }
    .zl-appbar::after {
      content:""; position:absolute; inset:auto 0 0 0; height:3px;
      background:linear-gradient(90deg, var(--accent) 0%, transparent 65%);
    }
    .zl-brand { display:flex; align-items:center; gap:14px; }
    .zl-brand-logo { flex:0 0 auto; height:auto; width:min(104px, 25vw); display:block; }
    .zl-brand-text { min-width:0; }
    .zl-brand-title { font-size:2.1rem; font-weight:800; color:var(--band-ink); letter-spacing:0; line-height:1.1; margin:0; direction:rtl; }
    .zl-brand-sub { font-size:0.78rem; font-weight:600; color:var(--band-ink-soft); letter-spacing:0.08em; margin-top:3px; }
    .zl-brand-rule { width:44px; height:2px; background:var(--accent); margin-top:7px; border-radius:2px; }

    /* Corner controls: anchored to the header, so they scroll away with it
       instead of hovering over the content. */
    .zl-corner { position:absolute; left:14px; top:calc(14px + env(safe-area-inset-top, 0px)); display:flex; gap:8px; z-index:5; }
    /* the band is the first thing on the page, so its own top padding has to
       clear the status bar before the buttons are placed against it */
    .zl-appbar { padding-top:calc(20px + env(safe-area-inset-top, 0px)); }
    .zl-iconbtn {
      position:relative;
      width:40px; height:40px; border-radius:50%;
      display:flex; align-items:center; justify-content:center;
      background:var(--band-wash); border:1px solid var(--band-line);
      color:var(--band-ink); cursor:pointer; padding:0;
      backdrop-filter:blur(2px);
      touch-action:manipulation; -webkit-appearance:none;
    }
    .zl-iconbtn:hover { background:var(--band-line); }
    .zl-syncdot {
      position:absolute; bottom:-2px; left:-2px;
      width:16px; height:16px; border-radius:50%;
      display:flex; align-items:center; justify-content:center;
      border:2px solid #0A0A0A; color:#fff; background:var(--accent);
    }
    .zl-syncdot[data-ok="true"] { background:#2E9E6B; }
    .zl-syncmark {
      width:18px; height:18px; border-radius:50%;
      display:inline-flex; align-items:center; justify-content:center;
      color:#fff; background:var(--bad); flex:0 0 18px;
    }
    .zl-syncmark[data-ok="true"] { background:var(--ok); }

    /* ---- feedback ---- */
    .zl-root button { transition:transform .12s ease; }
    .zl-root button:active { transform:scale(0.97); }
    @keyframes zl-pop { 0% { transform:scale(0.92); } 60% { transform:scale(1.04); } 100% { transform:scale(1); } }
    @keyframes zl-shake { 0%,100% { transform:translateX(0); } 20% { transform:translateX(-5px); } 40% { transform:translateX(5px); } 60% { transform:translateX(-3px); } 80% { transform:translateX(3px); } }
    .zl-pop { animation:zl-pop .3s ease; }
    .zl-shake { animation:zl-shake .34s ease; }
    @media (prefers-reduced-motion: reduce) { .zl-pop, .zl-shake { animation:none; } }

    /* ---- login: a single card, navy above and form below ---- */
    .zl-login {
      background:var(--surface);
      border:1px solid var(--line);
      border-radius:var(--r-lg);
      overflow:hidden;
      box-shadow:var(--shadow-md);
    }
    .zl-login-head {
      position:relative;
      text-align:center;
      padding:22px 22px 24px;
      background:var(--band);
    }
    .zl-login-head::after {
      content:""; position:absolute; inset:auto 0 0 0; height:3px;
      background:linear-gradient(90deg, var(--accent) 0%, transparent 70%);
    }
    .zl-login-logo { width:min(230px, 62%); display:block; margin:0 auto; }
    .zl-login-body { padding:20px; }

    /* ---- greeting screen ---- */
    @keyframes zl-rise { from { opacity:0; transform:translateY(12px) scale(0.97);} to { opacity:1; transform:none;} }
    .zl-greet {
      position:fixed; inset:0; z-index:2000;
      display:flex; flex-direction:column; align-items:center; justify-content:center; gap:22px;
      background:var(--band);
      padding:28px;
    }
    .zl-greet-logo { width:min(190px, 48vw); animation:zl-rise .5s ease both; }
    .zl-greet-hi {
      font-size:clamp(1.5rem, 6vw, 2.1rem); font-weight:800; color:var(--band-ink);
      text-align:center; line-height:1.5; margin:0;
      animation:zl-rise .5s ease .12s both;
    }
    .zl-greet-rule { width:70px; height:3px; background:var(--accent); border-radius:2px; animation:zl-rise .5s ease .2s both; }
    .zl-greet-note { font-size:0.8rem; color:var(--band-ink-soft); animation:zl-rise .5s ease .28s both; }
    @media (prefers-reduced-motion: reduce) {
      .zl-greet-logo, .zl-greet-hi, .zl-greet-rule, .zl-greet-note { animation:none; }
    }

    /* ---- Surat al-Fatiha strip (inside the navy header) ---- */
    .zl-fatiha {
      margin-top:16px;
      padding:11px 14px 12px;
      background:var(--band-wash);
      border:1px solid var(--band-line);
      border-radius:var(--r-md);
    }
    .zl-fatiha-head { display:flex; align-items:center; gap:10px; margin-bottom:7px; }
    .zl-fatiha-title { font-size:0.82rem; font-weight:700; color:var(--band-ink); }
    .zl-fatiha-rule { flex:1; height:1px; background:var(--band-line); }
    .zl-fatiha-sub { font-size:0.62rem; font-weight:600; letter-spacing:0.06em; color:var(--band-ink-soft); }
    .zl-fatiha-body {
      font-size:12px;
      font-weight:500;
      line-height:2.05;
      color:var(--band-ink);
      opacity:0.82;
      margin:0;
      text-align:justify;
      text-align-last:justify;
      text-justify:inter-word;
      hyphens:none;
      overflow-wrap:normal;
      word-break:normal;
    }
    .zl-fatiha-verse { white-space:normal; }
    .zl-fatiha-num {
      display:inline-flex; align-items:center; justify-content:center;
      width:15px; height:15px; margin-inline-start:5px; margin-inline-end:0;
      border-radius:50%;
      border:1px solid var(--accent);
      background:var(--accent-soft);
      color:var(--accent);
      font-size:0.55rem; font-weight:700;
      vertical-align:2px;
    }

    /* ---- tabs ---- */
    .zl-tabs { display:flex; gap:4px; overflow-x:auto; border-bottom:1px solid var(--line); margin-bottom:20px; }
    .zl-tab {
      display:flex; align-items:center; gap:8px;
      background:none; border:none; padding:11px 15px;
      font:inherit; font-size:0.9rem; font-weight:500; color:var(--ink-muted);
      border-bottom:2px solid transparent; cursor:pointer; white-space:nowrap;
      transition:color .15s, border-color .15s;
    }
    .zl-tab:hover { color:var(--ink); }
    .zl-tab[data-active="true"] { font-weight:700; color:var(--navy); border-bottom-color:var(--accent); }

    .zl-dir { display:inline-flex; background:var(--bg); border:1px solid var(--line); border-radius:10px; padding:3px; gap:3px; }
    .zl-dir-btn { border:none; background:none; font:inherit; font-size:0.78rem; font-weight:600; color:var(--ink-muted); padding:6px 12px; border-radius:8px; cursor:pointer; white-space:nowrap; }
    .zl-dir-btn[data-active="true"] { background:var(--navy); color:var(--surface); }

    .zl-search { width:100%; padding:11px 14px; border:1px solid var(--line); border-radius:10px; font:inherit; font-size:0.9rem; margin-bottom:10px; outline:none; background:var(--surface); color:var(--ink); }

    /* ---- session progress ---- */
    .zl-session { display:flex; align-items:center; gap:10px; margin-bottom:14px; }
    .zl-session-track { flex:1; height:6px; background:var(--line); border-radius:4px; overflow:hidden; }
    .zl-session-fill { display:block; height:100%; background:var(--navy); border-radius:4px; transition:width .3s ease; }
    .zl-session-num { font-size:0.8rem; font-weight:700; color:var(--ink-muted); flex:0 0 auto; }

    /* ---- routine week ---- */
    .zl-weeknav {
      flex:0 0 30px; align-self:stretch;
      display:flex; align-items:center; justify-content:center;
      background:var(--bg); border:1px solid var(--line); border-radius:10px;
      color:var(--navy); cursor:pointer; padding:0;
    }
    .zl-weeknav:disabled { opacity:0.3; cursor:default; }
    .zl-daydetail { border-top:1px solid var(--line); margin-top:12px; padding-top:10px; }
    .zl-week-card {
      position:relative; background:var(--surface); border:1px solid var(--line);
      border-radius:var(--r-lg); padding:18px 18px 14px; margin-bottom:20px;
      box-shadow:var(--shadow-sm); overflow:hidden;
    }
    .zl-week-card::before { content:""; position:absolute; inset:0 auto 0 0; width:3px; background:var(--accent); }
    .zl-week { flex:1 1 auto; min-width:0; display:flex; gap:6px; }
    .zl-day {
      flex:1 1 0; min-width:0;
      display:flex; flex-direction:column; align-items:center; gap:4px;
      padding:10px 2px 8px; border-radius:10px;
      background:var(--bg); border:1px solid var(--line);
      font:inherit; color:var(--ink); cursor:pointer;
      transition:background .15s, border-color .15s;
    }
    .zl-day[data-on="true"] { background:rgba(46,124,184,0.12); border-color:rgba(46,124,184,0.4); }
    .zl-day[data-full="true"] { background:var(--ok); border-color:var(--ok); color:#fff; }
    .zl-day[data-today="true"] { box-shadow:0 0 0 2px var(--accent); }
    .zl-day[data-open="true"] { border-color:var(--navy); }
    .zl-day[data-future="true"] { opacity:0.38; cursor:default; }
    .zl-day-name { font-size:0.8rem; font-weight:700; line-height:1; }
    .zl-day-num { font-size:0.68rem; opacity:0.6; line-height:1; }
    .zl-day-pips { display:flex; gap:2px; margin-top:2px; }
    .zl-pip { width:5px; height:5px; border-radius:50%; background:currentColor; opacity:0.18; }
    .zl-pip[data-on="true"] { opacity:1; color:var(--ok); }
    .zl-day[data-full="true"] .zl-pip[data-on="true"] { color:#fff; }
    .zl-due-line { display:flex; align-items:center; justify-content:space-between; gap:8px; width:100%; margin-top:12px; padding-top:10px; border-top:1px solid var(--line); font-size:0.82rem; color:var(--ink-muted); }

    /* ---- vocab filter bar ---- */
    .zl-sortbar { display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:10px; }
    .zl-sortbtn { display:inline-flex; align-items:center; gap:8px; background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:9px 14px; font:inherit; font-size:0.85rem; font-weight:700; color:var(--navy); cursor:pointer; box-shadow:var(--shadow-sm); }
    .zl-sortbtn[data-active="true"] { background:var(--navy); border-color:var(--navy); color:var(--surface); }
    .zl-sortpanel { background:var(--surface); border:1px solid var(--line); border-radius:var(--r-md); padding:12px; margin-bottom:12px; box-shadow:var(--shadow-sm); }
    .zl-sortrow { display:flex; align-items:center; gap:10px; width:100%; padding:9px 8px; background:none; border:none; border-radius:8px; font:inherit; font-size:0.87rem; cursor:pointer; text-align:right; color:inherit; }
    .zl-sortrow:hover { background:var(--bg); }
    .zl-sortbox { flex:0 0 18px; height:18px; border-radius:5px; border:1.5px solid var(--line); display:flex; align-items:center; justify-content:center; color:#fff; }
    .zl-sortrow[data-on="true"] .zl-sortbox { background:var(--navy); border-color:var(--navy); }
    .zl-sortcount { color:var(--ink-muted); font-size:0.78rem; }

/* =========================================================================
   PROGRESS HELPERS
   ========================================================================= */
/* =========================================================================
   SPACED REPETITION
   Each item carries its own next-review date. A correct answer pushes the
   review one rung further out along the ladder below; a wrong answer resets
   the ladder and brings the item back in this same session. The ladder tops
   out at two weeks on purpose — longer gaps feel like forgetting. Items that are due
   (or have never been seen) are what the practice queues serve first.
   ========================================================================= */
const DAY_MS = 86400000;
const SRS_LADDER = [1, 2, 4, 7, 10, 14];

/* Flashcards run as a finite session rather than an endless loop. The daily
   session covers what the schedule says is due, capped so a backlog never
   turns into an unfinishable pile; opening flashcards from the practice list
   is a shorter, off-schedule drill. */
/* The daily card session follows the queue rather than a fixed number: it
   serves whatever is actually due, up to a ceiling. A fixed size stops
   working once several meetings are open — twenty cards covered a seventh of
   meeting 1, but would cover a fortieth of six meetings, and the older
   material would quietly stop coming round. */
const SESSION_CAP = 30;
const SESSION_MIN = 10;

/* Knowing the material well enough to build on it, which is what marking the
   next meeting really asks.

   Set against what the routine actually earns. A full week of it now runs to
   about 74 credit a day — the morning drill and the games were added after
   this number was first chosen — which reaches roughly 62% of an average
   meeting, and 48% of the largest one. Fifty per cent therefore means: keep
   the routine and you are nearly there; a little practice of your own closes
   the gap. Forty-five had become a bar that a week of routine cleared in
   every meeting without trying.

   Distinct from mastery, which asks whether you will still know it in a
   month and takes two to three weeks per meeting. */
const READY_PCT = 50;

/* The book runs to fifteen meetings. Words and practice sentences belong to
   the meeting that introduced them; letters and idioms carry no meeting at
   all, because they are not taught in one — they stay available throughout.

   Nothing is ever locked. The meeting you mark simply decides which material
   the practice queues draw on, so the app follows the course rather than
   deciding when you are allowed to move on. */
const TOTAL_MEETINGS = 15;

function itemMeeting(item) {
    return item && typeof item.meeting === "number" ? item.meeting : 0;
}

/* 0 means "not tied to a meeting" and is always in play. */
function isUnlocked(item, upTo) {
    const m = itemMeeting(item);
    return m === 0 || m <= upTo;
}

const DECK_LABELS = {
    vocab: "אוצר מילים",
    letters: "אלף-בית",
    sentences: "משפטים",
    idioms: "ניבי לשון",
    mix: "ערבוב",
};

/* How long one sitting runs. A session that ends is a session you finish. */
/* The morning session: mostly recognition, with a third of the questions
   asking for the word to be produced from memory. Declared here with the
   other session sizes because the daily routine's description reads it. */
const MORNING_PLAN = { choice: 20, typed: 10 };
/* The same drill with nothing but typed questions — the hardest way to be
   asked, and the closest to producing the word in conversation. */
const TYPED_PLAN = { choice: 0, typed: 15 };
/* The daily review of what has come due. Three question types over the same
   words: a word met the same way every time is remembered in that one shape
   and nowhere else. `card` questions are the flashcard, self-marked. */
const REVIEW_PLAN = { choice: 0.4, typed: 0.3, card: 0.3 };

const SESSION_SIZES = {
    flashcards: 20,
    quiz: 20,
    builder: 10,
    reading: 5,
    idioms: 5,
};

function isDue(item) {
    return !item.dueAt || item.dueAt <= Date.now();
}

function dueCount(list) {
    return list.filter(isDue).length;
}

/* "Waiting for review today" had three different answers on one screen: the
   week strip counted every word in the book including meetings not yet
   reached, the statistics card counted only what had come due by this exact
   minute, and the forecast counted through the end of the day. Three numbers,
   one question. This is the single answer: words the learner has actually
   reached, whose review falls due at any point today. */
function dueTodayCount(list, upTo) {
    const endOfDay = new Date();
    endOfDay.setHours(23, 59, 59, 999);
    const end = endOfDay.getTime();
    return (list || []).filter((w) => {
        if (upTo !== undefined && !isUnlocked(w, upTo)) return false;
        return !w.dueAt || w.dueAt <= end;
    }).length;
}

function scheduleNext(item, correct) {
    const streak = correct ? (item.streak || 0) + 1 : 0;
    const days = correct ? SRS_LADDER[Math.min(streak - 1, SRS_LADDER.length - 1)] : 0;
    return { streak: streak, dueAt: Date.now() + days * DAY_MS, lastSeen: Date.now() };
}

function dueLabel(item) {
    if (isDue(item)) return "לחזרה היום";
    const days = Math.ceil((item.dueAt - Date.now()) / DAY_MS);
    if (days <= 1) return "מחר";
    return "בעוד " + days + " ימים";
}

/* Not every right answer is worth the same.

   Picking the right option out of four is recognition; typing the word from
   memory, or assembling a whole sentence, is recall — a different and harder
   skill. Counting them equally would flatter a score built entirely on
   multiple choice, so recall is worth double.

   A wrong answer costs half a point and never resets the word to zero. One
   slip on a tired evening should cost a step backwards, not a month of work.  */
const ANSWER_WEIGHT = {
    choice: 1,      // multiple choice — recognition
    card: 1,        // a flashcard marked "ידעתי" — self-reported recall
    typed: 2,       // typed from memory
    sentence: 2,    // a sentence assembled correctly
};

function answerCredit(kind) {
    return ANSWER_WEIGHT[kind] || 1;
}

const MASTERY_TARGET = 6;
/* `correctCount` accumulates credit, not answers, so it can hold halves. */
const netScore = (item) => Math.max(0, (item.correctCount || 0) - 0.5 * (item.wrongCount || 0));
const progressPct = (item) => Math.min(100, Math.round((netScore(item) / MASTERY_TARGET) * 100));
const isMastered = (item) => progressPct(item) >= 100;
const isStruggling = (item) => !isMastered(item) && (item.wrongCount || 0) >= 2 && progressPct(item) < 50;

/* A continuous read on how well a deck is known, as opposed to how many of
   its items have crossed the mastery line. Every item contributes what it has
   earned so far, so an evening of good practice moves the number instead of
   leaving it at zero for a month. */
function knowledgeScore(items) {
    const list = items || [];
    if (list.length === 0) return 0;
    const sum = list.reduce((acc, it) => acc + Math.min(1, netScore(it) / MASTERY_TARGET), 0);
    return Math.round((sum / list.length) * 100);
}

function withProgressFields(list) {
    return list.map((i) => ({ correctCount: 0, wrongCount: 0, ...i }));
}

/* Every practice mode runs shuffled. The order is drawn fresh each pass, and
   weighted: an item you have been getting wrong is pulled toward the front,
   an item you have mastered drifts to the back. The random multiplier keeps
   two passes from ever looking the same. */
/* A word can carry more than one sense (אַמִין is a role and also a man's
   name). Practice picks one of them per card, so both get drilled; when
   checking a typed answer, every sense is accepted. */
function allMeanings(item) {
    return [item.back].concat(item.alts || []).filter(Boolean);
}

function pickMeaning(item) {
    const list = allMeanings(item);
    return list[Math.floor(Math.random() * list.length)];
}

/* A small tilt toward the meeting most recently opened.

   The heavy lifting for new material is already done by the "never reviewed"
   term below, which is worth 1.5. This bonus is deliberately an order smaller:
   its job is to break the tie *among* untouched items so that the meeting you
   just started comes up before words from meeting 1 you never got to — not to
   outrank the review schedule.

   The size matters. An earlier version used 1.2 and a brand-new word overtook
   a word that was a week overdue, which is exactly backwards: lateness is the
   strongest evidence of forgetting there is. At 0.3 the ordering holds, and
   the bonus fades to nothing after four correct answers. */
function freshMeetingBonus(item, currentMeeting) {
    if (!currentMeeting || itemMeeting(item) !== currentMeeting) return 0;
    const right = item.correctCount || 0;
    return Math.max(0, 0.3 - 0.075 * right);
}

/* Practice is centred on the meeting in hand.

   The one before it stays close behind, the one before that is thinner, and
   anything older is present but quiet. This is a multiplier rather than a
   subtraction, so it scales the whole weight — including the overdue term.
   That matters: a word from meeting 1 that is genuinely late still climbs
   back up, which is what stops old material from being lost as the course
   moves on. */
function meetingDistanceFactor(item, currentMeeting) {
    const m = itemMeeting(item);
    if (!m || !currentMeeting) return 1;          // letters and idioms
    const back = currentMeeting - m;
    if (back <= 0) return 1;
    if (back === 1) return 0.7;
    if (back === 2) return 0.45;
    return 0.28;
}

function itemWeight(item, currentMeeting) {
    const right = item.correctCount || 0;
    const wrong = item.wrongCount || 0;
    let weight = 1 + 1.6 * wrong - 0.45 * right;
    if (isMastered(item)) weight = Math.min(weight, 0.3);
    weight = Math.max(0.25, weight);
    const fresh = freshMeetingBonus(item, currentMeeting);
    const near = meetingDistanceFactor(item, currentMeeting);
    if (!item.dueAt) return (weight + 1.5 + fresh) * near;   // never reviewed — show it early
    const overdueDays = (Date.now() - item.dueAt) / DAY_MS;
    if (overdueDays < 0) return weight * 0.12 * near;        // scheduled for a later day
    /* Lateness is added after the distance factor, not multiplied by it.
       Scaling it too would mean an old meeting could never climb back no
       matter how thoroughly it had been forgotten — which is precisely the
       material that most needs to return. Being far behind makes a word
       quieter; being overdue still makes it urgent. */
    return (weight + fresh) * near + Math.min(3, overdueDays);
}

/* How a session is divided between the meetings that are open.

   Each meeting back gets half the share of the one in front of it, and the
   shares are normalised to fill the session. Two meetings open give 67/33,
   three give 57/29/14, four 53/27/13/7 — the split rebalances itself as the
   course goes on, without a number to retune.

   Weighting alone could not produce this. Once a new word is answered
   correctly it is scheduled a day or more out and its weight collapses, while
   older material that has come due keeps arriving; measured over a session,
   the current meeting fell to about one percent within a week of opening it.
   So the division is made explicit, and the usual weighting decides the order
   inside each meeting's own share. */
const MEETING_DECAY = 0.5;

function meetingShares(openMeetings) {
    const weights = openMeetings.map((_, i) => Math.pow(MEETING_DECAY, i));   // newest first
    const total = weights.reduce((a, b) => a + b, 0);
    return weights.map((w) => w / total);
}

function composeSession(deck, currentMeeting, size) {
    if (!currentMeeting || deck.length === 0) {
        return weightedOrder(deck, currentMeeting).slice(0, size);
    }
    /* Group by meeting, newest first. Letters and idioms carry no meeting;
       they ride along with the current one rather than forming a group of
       their own, since they are meant to stay in circulation throughout. */
    const groups = new Map();
    deck.forEach((item, i) => {
        const m = itemMeeting(item) || currentMeeting;
        if (!groups.has(m)) groups.set(m, []);
        groups.get(m).push(i);
    });
    const meetings = Array.from(groups.keys()).sort((a, b) => b - a);
    if (meetings.length < 2) return weightedOrder(deck, currentMeeting).slice(0, size);

    const shares = meetingShares(meetings);
    const ranked = meetings.map((m) => {
        const group = groups.get(m);
        return weightedOrder(group.map((i) => deck[i]), currentMeeting).map((k) => group[k]);
    });

    /* Hand out the slots, then give any that could not be filled — because a
       meeting has run out of cards — to the meetings that still have some. */
    const want = shares.map((s) => Math.round(size * s));
    const taken = ranked.map((list, i) => list.slice(0, Math.min(want[i], list.length)));
    let short = size - taken.reduce((n, list) => n + list.length, 0);
    for (let i = 0; i < ranked.length && short > 0; i++) {
        const extra = ranked[i].slice(taken[i].length, taken[i].length + short);
        taken[i] = taken[i].concat(extra);
        short -= extra.length;
    }
    return shuffle([].concat.apply([], taken));
}

function weightedOrder(data, currentMeeting) {
    return data
        .map((d, i) => ({ i: i, score: itemWeight(d, currentMeeting) * (0.55 + Math.random() * 0.9) }))
        .sort((a, b) => b.score - a.score)
        .map((entry) => entry.i);
}

function shuffle(arr) {
    const a = [...arr];
    for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
}

/* FIX #3: items added to DEFAULT_VOCAB / ALPHABET after a user's first visit
   never appeared, because the saved copy in localStorage replaced the
   defaults wholesale. New default items are now merged in by id, while
   saved progress and user-created words are preserved. */
function mergeDefaults(stored, defaults) {
    if (!Array.isArray(stored)) return withProgressFields(defaults);
    // NOTE: this used to build the copies first and then Object.assign onto the
    // ORIGINAL stored objects, so new fields on the built-in items (topic, and
    // anything added later) never reached the list that was actually returned.
    const merged = stored.map((item) => ({ correctCount: 0, wrongCount: 0, ...item }));
    const byId = new Map(merged.map((item) => [item.id, item]));
    defaults.forEach((def) => {
        const existing = byId.get(def.id);
        if (!existing) {
            merged.push({ correctCount: 0, wrongCount: 0, ...def });
        } else {
            const keep = {
                correctCount: existing.correctCount || 0,
                wrongCount: existing.wrongCount || 0,
                streak: existing.streak,
                dueAt: existing.dueAt,
                lastSeen: existing.lastSeen,
            };
            Object.assign(existing, def, keep);
        }
    });
    return merged;
}

/* =========================================================================
   PERSISTENCE (localStorage)
   ========================================================================= */
function usePersistedState(key, initial, reviver) {
    const [state, setState] = useState(() => {
        try {
            const raw = window.localStorage.getItem(key);
            if (!raw) return initial;
            const parsed = JSON.parse(raw);
            return reviver ? reviver(parsed) : parsed;
        }
        catch (e) {
            return initial;
        }
    });
    useEffect(() => {
        try {
            window.localStorage.setItem(key, JSON.stringify(state));
        }
        catch (e) {
            /* storage unavailable — ignore */
        }
    }, [key, state]);
    return [state, setState];
}

function wordKey(text) {
    return String(text || "")
        .replace(/[\u0591-\u05C7\u0610-\u065F]/g, "")
        .replace(/[\s()'"\u2013\-,.\/]/g, "");
}

function initialVocab() {
    const base = withProgressFields(DEFAULT_VOCAB);
    const byKey = new Map(base.map((w) => [wordKey(w.front), w]));
    const retired = new Set(LEGACY_FRONTS.map(wordKey));
    let nextId = DEFAULT_VOCAB.reduce((m, w) => Math.max(m, w.id || 0), 0);
    const extraKeys = new Set();

    ["vocab-data-v4", "vocab-data-v3", "vocab-data-v2", "vocab-data"].forEach((key) => {
        let stored = null;
        try { stored = JSON.parse(window.localStorage.getItem(key) || "null"); }
        catch (e) { stored = null; }
        if (!Array.isArray(stored)) return;
        stored.forEach((w) => {
            if (!w || !w.front) return;
            const k = wordKey(w.front);
            const builtIn = byKey.get(k);
            if (builtIn) {
                // same word, keep whichever history is further along
                builtIn.correctCount = Math.max(builtIn.correctCount || 0, w.correctCount || 0);
                builtIn.wrongCount = Math.max(builtIn.wrongCount || 0, w.wrongCount || 0);
                if (w.streak) builtIn.streak = Math.max(builtIn.streak || 0, w.streak);
                if (w.dueAt) builtIn.dueAt = Math.max(builtIn.dueAt || 0, w.dueAt);
                return;
            }
            if (retired.has(k)) return;          // an old copy of a built-in word
            if (extraKeys.has(k)) return;
            extraKeys.add(k);
            nextId += 1;
            base.push({ correctCount: 0, wrongCount: 0, ...w, id: nextId, topic: w.topic || "מילים שלי" });
        });
    });

/* The surah is rendered as one justified block. Both edges are flush on every
   line, and the type size is auto-fitted so the final line lands full-width
   instead of leaving a short "tail" — the fit re-runs on resize, orientation
   change and after the webfont loads, so it holds on any screen. */
const FATIHA_MIN_PX = 10;
const FATIHA_MAX_PX = 17;
const FATIHA_STEP_PX = 0.15;

function lastLineFill(el) {
    const range = document.createRange();
    range.selectNodeContents(el);
    const rects = Array.from(range.getClientRects()).filter((r) => r.width > 1 && r.height > 1);
    if (rects.length === 0) return { ratio: 1, lines: 1 };
    const lines = [];
    rects.forEach((r) => {
        const line = lines.find((l) => Math.abs(l.top - r.top) < 6);
        if (line) {
            line.left = Math.min(line.left, r.left);
            line.right = Math.max(line.right, r.right);
        } else {
            lines.push({ top: r.top, left: r.left, right: r.right });
        }
    });
    lines.sort((a, b) => a.top - b.top);
    const last = lines[lines.length - 1];
    const width = el.clientWidth || 1;
    return { ratio: Math.min(1, (last.right - last.left) / width), lines: lines.length };
}

function fitFatiha(el) {
    if (!el || !el.clientWidth) return;
    el.style.textAlignLast = "auto";
    let best = null;
    /* Search the whole size range rather than stopping at the first decent
       result: on a wide screen only a few sizes make the final line land near
       the edge, and those are what keep the block rectangular. */
    for (let px = FATIHA_MAX_PX; px >= FATIHA_MIN_PX - 0.001; px -= FATIHA_STEP_PX) {
        el.style.fontSize = px.toFixed(2) + "px";
        const measured = lastLineFill(el);
        if (measured.lines === 1) {
            if (!best) best = { px: px, ratio: 1, lines: 1 };
            continue;
        }
        if (!best || best.lines === 1 || measured.ratio > best.ratio + 0.003) {
            best = { px: px, ratio: measured.ratio, lines: measured.lines };
        }
        if (measured.ratio >= 0.985) break;
    }
    el.style.fontSize = (best ? best.px.toFixed(2) : "14") + "px";
    // stretch the last line only when it is already close to the edge
    const worthJustifying = best && best.lines > 1 && best.ratio >= 0.7;
    el.style.textAlignLast = worthJustifying ? "justify" : "right";
}

const EVENING_NUMBERS = [

        .map((g, i) => ({ g: g, r: dayNoise(dateKey, "evening" + i) }))

const NOON_GAMES = [

function dayNoise(key, salt) {
    let h = 2166136261;
    const text = key + "|" + salt;
    for (let i = 0; i < text.length; i++) {
        h ^= text.charCodeAt(i);
        h = Math.imul(h, 16777619);

    return ((h >>> 0) % 100000) / 100000;

        .sort((a, b) => a.r - b.r).map((x) => x.g);

function localDateKey(d) {
    const dt = d || new Date();

    return dt.getFullYear() + "-" + pad(dt.getMonth() + 1) + "-" + pad(dt.getDate());

   never shift under the day names. */

    const names = ["א", "ב", "ג", "ד", "ה", "ו", "ש"];
    const todayKey = localDateKey();
    const sunday = new Date();
    sunday.setHours(0, 0, 0, 0);
    sunday.setDate(sunday.getDate() - sunday.getDay() - (weeksBack || 0) * 7);
    const days = [];
    for (let i = 0; i < 7; i++) {
        const date = new Date(sunday);
        date.setDate(sunday.getDate() + i);
        const key = localDateKey(date);
        const entry = checklist[key] || {};
        const doneKeys = Object.keys(entry).filter((k) => entry[k]);
        days.push({
            key: key,
            name: names[i],
            date: date.getDate() + "." + (date.getMonth() + 1),
            done: doneKeys.length,
            doneKeys: doneKeys,
            today: key === todayKey,
            future: key > todayKey,
        });
    }
    return days;
}

/* How well a meeting's material is known right now.

   This deliberately measures knowledge and not mastery. Mastery asks whether
   a word will still be there in a month, and by construction takes two to
   three weeks per meeting — a course that moves weekly could never satisfy
   it, and a bar nobody can clear is noise rather than information. Readiness
   asks the question that marking the next meeting actually raises: do I know
   this well enough to build on it. */
function meetingReadiness(vocab, sentences, meeting) {

        .filter((it) => itemMeeting(it) === meeting);
    if (items.length === 0) return { total: 0, mastered: 0, pct: 1, ready: true };
    const pct = knowledgeScore(items) / 100;
    return {
        total: items.length,
        mastered: items.filter(isMastered).length,
        pct: pct,
        ready: pct * 100 >= READY_PCT,

/* =========================================================================
   DECKS
   Words, letters, sentences and idioms are four separate banks, but every
   practice mode wants to treat them the same way: draw an item, show a
   front, show a back, record the answer. `buildDeck` tags each item with
   the bank it came from so a single component can drill any mixture of
   them, and `applyResult` sends the score back to the right bank.
   ========================================================================= */
/* Some sentences are for reading only. The booklet's pronoun drills run to a
   dozen words, and breaking one into tiles — plus decoys — produces a wall of
   buttons that is unusable on a phone. They stay in the flashcard and
   fill-in-the-blank decks, where length costs nothing. */

    return (list || []).map((item) => ({ ...item, _deck: name, _key: name + ":" + item.id }));
}

function buildDeck(kind, banks) {
    /* `banks.meeting` is how far the learner has marked themselves in the
       course. Letters and idioms carry no meeting and survive the filter.

       If the meeting is missing the filter is skipped rather than applied with
       a zero, which would quietly empty every deck. A fault here should leave
       too much material on the table, never none. */
    const upTo = banks.meeting;
    const limited = typeof upTo === "number" && upTo >= 1;
    const pick = (name) => {
        const deck = tagDeck(banks[name], name);
        return limited ? deck.filter((it) => isUnlocked(it, upTo)) : deck;
    };
    if (kind === "mix") return pick("vocab").concat(pick("letters"));
    return pick(kind);

/* The two faces of a card, whichever bank it came from. `reversed` means the
   prompt is the Hebrew side and the answer is the Arabic one — the harder
   direction, and the one that speaking actually needs. */

    if (item._deck === "letters") {

            back: reversed ? item.letter : item.name,

            front: reversed ? item.hebrew : item.arabic,
            back: reversed ? item.arabic : item.hebrew,

    if (item._deck === "idioms") {

/* =========================================================================
   MORNING VOCABULARY DRILL

   The day's main session. Most of it is multiple choice, but a third of the
   questions ask for the word to be typed from memory — recognising an option
   and producing the word are different skills, and only the second is what
   speaking demands.

   Words whose translation collapses to a single character once punctuation is
   stripped — "ב...", "מ..." — cannot be typed at all, so they are always
   asked as multiple choice however the mix falls.
   ========================================================================= */
/* The due-word review: the same words asked three ways.

   Built separately from the morning drill because it draws from a pool the
   caller has already narrowed — whatever is actually due — rather than
   composing a session from the whole deck. */
function buildReviewTasks(pool, meeting, size) {
    const picked = composeSession(pool, meeting, Math.min(size, pool.length)).map((i) => pool[i]);
    if (picked.length === 0) return [];

    const typeable = picked.filter(isTypeable);
    const wantTyped = Math.min(Math.round(picked.length * REVIEW_PLAN.typed), typeable.length);
    const typedKeys = new Set(shuffle(typeable).slice(0, wantTyped).map((it) => it._key));

    const rest = picked.filter((it) => !typedKeys.has(it._key));
    const wantCard = Math.round(picked.length * REVIEW_PLAN.card);
    const cardKeys = new Set(shuffle(rest).slice(0, wantCard).map((it) => it._key));

    return shuffle(picked.map((item) => {
        if (typedKeys.has(item._key)) return { item: item, mode: "typed", dir: "ar2he" };
        if (cardKeys.has(item._key)) return { item: item, mode: "card", dir: resolveDir("mix") };
        return { item: item, mode: "choice", dir: resolveDir("mix") };
    }));
}

function buildMorningTasks(deck, meeting, plan) {
    const mix = plan || MORNING_PLAN;
    const size = mix.choice + mix.typed;
    const picked = composeSession(deck, meeting, size).map((i) => deck[i]);
    if (picked.length === 0) return [];

    /* Decide which questions are typed before shuffling, so the mix is right
       even when the session is short of cards. A word with no typeable answer
       — "ב...", "מ..." — falls back to multiple choice even in a typed-only
       session, since there is nothing there to type. */
    const typeable = picked.filter(isTypeable);
    const wantTyped = Math.min(mix.typed,
                               Math.round(picked.length * (mix.typed / size)),
                               typeable.length);
    const typedKeys = new Set(shuffle(typeable).slice(0, wantTyped).map((it) => it._key));

    /* A typed question is always Arabic to Hebrew.

       The other direction would ask for a pointed transliteration, and a
       phone keyboard cannot produce one — the letters can be right and the
       answer still marked wrong for want of a vowel that cannot be typed.
       Producing pointed text is not a skill the course teaches, so that
       direction stays multiple choice. */
    return shuffle(picked.map((item) => ({
        item: item,
        open: typedKeys.has(item._key),
        dir: typedKeys.has(item._key) ? "ar2he" : resolveDir("mix"),
    })));
}

function MorningDrill({ banks, applyResult, onBack, onSessionDone, plan, title }) {
    const deck = useMemo(() => buildDeck("vocab", banks), [banks]);
    const [tasks, setTasks] = useState(() => buildMorningTasks(deck, banks.meeting, plan));
    const [pos, setPos] = useState(0);
    const [question, setQuestion] = useState(null);
    const [selected, setSelected] = useState(null);
    const [typed, setTyped] = useState("");
    const [result, setResult] = useState(null);
    const [score, setScore] = useState({ correct: 0, total: 0 });
    const [finished, setFinished] = useState(false);
    const timerRef = useRef(null);

    const restart = () => {
        setTasks(buildMorningTasks(deck, banks.meeting, plan));
        setPos(0); setSelected(null); setTyped(""); setResult(null);
        setScore({ correct: 0, total: 0 }); setFinished(false);
    };
    useEffect(() => { restart(); /* eslint-disable-next-line */ }, [deck.length]);

    useEffect(() => {
        if (!tasks.length || pos >= tasks.length) return;
        const t = tasks[pos];
        setQuestion(t.open ? null : buildQuestion(deck, t.item, t.dir));
        setSelected(null); setTyped(""); setResult(null);
        // eslint-disable-next-line react-hooks/exhaustive-deps
    }, [pos, tasks]);

    useEffect(() => { if (finished && onSessionDone) onSessionDone({ mode: plan ? "typed" : "morning", right: score.correct, total: score.total }); /* eslint-disable-next-line */ }, [finished]);
    useEffect(() => () => { if (timerRef.current) clearTimeout(timerRef.current); }, []);

    if (deck.length < 4) {
        return (React.createElement("div", { className: "zl-anim" },
            React.createElement(BackLink, { onClick: onBack }, "חזרה לשיטות תרגול"),
            React.createElement(Card, null, "צריך לפחות 4 מילים במאגר הפתוח.")));
    }
    if (finished) {
        return React.createElement(SessionSummary, {
            title: "סיימת · " + (title || "תרגול בוקר"),
            total: score.total, right: score.correct, wrong: score.total - score.correct,
            restartLabel: "סבב נוסף", onRestart: restart, onBack: onBack,
        });
    }
    if (!tasks.length) return null;
    const task = tasks[pos];
    if (!task) return null;

    const advance = (delay) => {
        if (timerRef.current) clearTimeout(timerRef.current);
        timerRef.current = setTimeout(() => {
            if (pos + 1 >= tasks.length) setFinished(true);
            else setPos(pos + 1);
        }, delay);
    };

    const record = (correct, kind) => {
        setScore((s) => ({ correct: s.correct + (correct ? 1 : 0), total: s.total + 1 }));
        applyResult(task.item, correct, kind);

        setSelected(opt);
        record(opt === question.correctAnswer, "choice");

    const giveUp = () => {

        React.createElement(BackLink, { onClick: onBack }, "חזרה לשיטות תרגול"),
        React.createElement(Card, null,
            React.createElement("h2", { className: "zl-display", style: { fontSize: "1.15rem", fontWeight: 800, marginBottom: 12 } },
                title || "תרגול בוקר · אוצר מילים"),
            React.createElement(SessionBar, { pos: pos + 1, total: tasks.length }),
            React.createElement("p", { style: { color: "var(--ink-muted)", fontSize: "0.85rem", marginBottom: 10 } },
                task.open ? "כתוב את התרגום:" : "בחר את התרגום:"),
            React.createElement(PromptBox, { text: prompt, isLetter: false }),
            task.open
                ? React.createElement("div", null,
                    React.createElement("input", {
                        className: "zl-search", value: typed, disabled: !!result,
                        placeholder: "התשובה שלך…", autoComplete: "off",
                        onChange: (e) => setTyped(e.target.value),
                        onKeyDown: (e) => { if (e.key === "Enter") submitTyped(); },
                        style: { marginBottom: 10 },
                    }),
                    result
                        ? React.createElement("p", { className: "zl-anim", style: {
                                fontWeight: 700, color: result === "correct" ? "var(--ok)" : "var(--bad)",
                                marginBottom: 4,

                            result === "correct" ? "נכון" : "התשובה: " + faces.back)
                        : React.createElement("div", { style: { display: "flex", gap: 8 } },
                            React.createElement(PrimaryButton, { onClick: submitTyped, disabled: !typed.trim() }, "בדוק"),
                            React.createElement(PrimaryButton, { variant: "outline", onClick: giveUp }, "לא יודע")))
                : (question ? React.createElement(ChoiceGrid, {
                    question: question, chosen: selected, locked: !!selected, onChoose: choose,

/* =========================================================================
   THE NUMBERS

   Read off the booklet and confirmed form by form, including the places
   where it is deliberately irregular: 14 and 17 end in אש where their
   neighbours end in עְש, and 12 is written with a tet although 2 is
   written with a tav.

   Composed numbers are assembled by the rule the book states — units
   before tens, וְ between every part — and that rule reproduces the three
   composed numbers the book writes out, which is how it was checked.
   ========================================================================= */
const NUM_ONE_TWO = {
    1: { m: "וַאחַד", f: "וַחְדֶה" },
    2: { m: "תְנֵין", f: "תִנְתֵין" }

/* The short form is for construct, before a plural noun. A drill that
   shows a number with no noun beside it always shows the long one. */
const NUM_3_10 = {

    4: { long: "אַרְבְּעַה", short: "אַרְבַּע" },

    7: { long: "סַבְּעַה", short: "סַבַּע" },
    8: { long: "תַמַאנְיֶה", short: "תַמַן" },
    9: { long: "תִסְעַה", short: "תִסַע" },
    10: { long: "עַשַרַה", short: "עַשַר" }
};

/* "alone" stands by itself; "before" precedes a singular noun. */
const NUM_11_19 = {

    12: { alone: "טְנַעְש", before: "טְנַעְשַר" },
    13: { alone: "תַלַטّעְש", before: "תַלַטّעְשַר" },
    14: { alone: "אַרְבַּעְטַאש", before: "אַרְבַּעְטַעְשַר" },
    15: { alone: "חַ'מִסְטַّאעְש", before: "חַ'מְסְטַעְשַר" },
    16: { alone: "סִטّעְש", before: "סִטّעְשַר" },
    17: { alone: "סַבַּעְטַאש", before: "סַבַּעְטַעְשַר" },
    18: { alone: "תַמַנְטّעְש", before: "תַמַנְטّעְשַר" },
    19: { alone: "תִסַעְטّעְש", before: "תִסַעְטّעְשַר" }
};

const NUM_TENS = {
    20: "עִשְרִין",
    30: "תַלַתִין",
    40: "אַרְבְּעִין",
    50: "חַ'מְסִין",
    60: "סִתّין",
    70: "סַבְּעִין",
    80: "תַמַנִין",
    90: "תִסְעִין"
};
const NUM_HUNDREDS = {
    100: "מִיֶّה",
    200: "מִיתֵין",
    300: "תַלַתְמִיֶّה",
    400: "אַרְבַּעְמִיֶّה",
    500: "חַ'מְסְמִיֶّה",
    600: "סִתְّמִיֶّה",
    700: "סַבַּעְמִיֶّה",
    800: "תַמַנְמִיֶّה",
    900: "תִסַעְמִיֶّה"
};

/* The book gives no ordinal above ten. */
const NUM_ORDINALS = {
    1: { m: "אַוّל", f: "אוּלַא" },
    2: { m: "תַאנִי", f: "תַאנְיֶה" },
    3: { m: "תַאלֶת", f: "תַאלְתַה" },
    4: { m: "רַאבֶּע", f: "רַאבְּעַה" },
    5: { m: "חַ'אמֶס", f: "חַ'אמְסֶה" },
    6: { m: "סַאדֶס", f: "סַאדְסֶה" },
    7: { m: "סַאבֶּע", f: "סַאבְּעַה" },
    8: { m: "תַאמֶן", f: "תַאמְנֶה" },
    9: { m: "תַאסֶע", f: "תַאסְעַה" },
    10: { m: "עַאשֶר", f: "עַאשְרַה" }
};

/* Written out in the book, and used to verify the rule above. */
const NUM_BOOK_COMPOSED = {
    140: "מִיֶّה וְאַרְבְּעִין",
    153: "מִיֶّה וְתַלַאתֶה וְחַ'מְסִין",
    296: "מִיתֵין וְסִתֶّה וְתִסְעִין"
};

const NUM_PERCENT = "בִּ(א)לְמִיֶّה";

function spellNumber(n, gender) {
    const g = gender || "m";
    if (NUM_BOOK_COMPOSED[n]) return NUM_BOOK_COMPOSED[n];
    if (n === 1 || n === 2) return NUM_ONE_TWO[n][g];
    if (n >= 3 && n <= 10) return NUM_3_10[n].long;
    if (n >= 11 && n <= 19) return NUM_11_19[n].alone;
    if (NUM_TENS[n]) return NUM_TENS[n];
    if (NUM_HUNDREDS[n]) return NUM_HUNDREDS[n];

    const parts = [];
    const hundreds = Math.floor(n / 100) * 100;
    const rest = n % 100;
    if (hundreds) parts.push(NUM_HUNDREDS[hundreds]);
    if (rest) {
        if (NUM_TENS[rest] || rest <= 19) {
            parts.push(spellNumber(rest, g));
        } else {
            /* Units before tens — the order the book gives. */
            parts.push(spellNumber(rest % 10, g));
            parts.push(NUM_TENS[Math.floor(rest / 10) * 10]);
        }
    }
    return parts.length > 1 ? parts.join(" \u05D5\u05B0") : parts[0];
}

/* =========================================================================
   NUMBER DRILLS

   Four exercises over the same data. They are separate because they test
   different things: reading a number, comparing several at speed, choosing
   the ordinal form the sentence structure calls for, and reading a
   percentage.

   Nothing is marked against the transliteration itself. The learner types
   digits, or picks a form — never spells one out — because a phone keyboard
   cannot produce pointed text, and the course does not ask anyone to.
   ========================================================================= */
/* Reading a number and reading a percentage are the same act — the
   percentage is the number plus a fixed phrase — so they are one drill,
   mixed, rather than two asking the same thing. */
const NUM_SESSION = { digits: 18, order: 6, ordinal: 12 };
const PERCENT_RATIO = 0.35;

/* How well the numbers are known.

   A number is not an item the way a word is: it is composed on the spot,
   answered, and gone, so there is nothing to attach a counter to. What can be
   tracked is the band it came from — the six groups that are learned
   separately and forgotten separately. A band is credited exactly as a word
   is, so its progress reads on the same scale.

   Kept on the profile rather than in a bank, because it belongs to no meeting
   and must not distort "how much of meeting 3 do I know". */
const NUM_BANDS = [
    { key: "ones",     label: "1 עד 10",     test: (n) => n <= 10 },
    { key: "teens",    label: "11 עד 19",    test: (n) => n >= 11 && n <= 19 },
    { key: "tens",     label: "עשרות",       test: (n) => n < 100 && n % 10 === 0 },
    { key: "hundreds", label: "מאות",        test: (n) => n >= 100 && n % 100 === 0 },
    { key: "composed", label: "מספרים מורכבים", test: (n) => n > 20 && n % 10 !== 0 },
    { key: "ordinals", label: "סודרים",      test: null },   // set by the drill, not the value
];

function numberBand(n) {
    const band = NUM_BANDS.find((b) => b.test && b.test(n));
    return band ? band.key : "composed";
}

/* One right answer is worth one point, as a recognition answer is; the band
   is "known" at the same MASTERY_TARGET a word is. */
function creditBand(profile, band, correct) {
    const stats = { ...((profile && profile.numberStats) || {}) };
    const cur = stats[band] || { right: 0, wrong: 0 };
    stats[band] = correct
        ? { right: cur.right + 1, wrong: cur.wrong }
        : { right: cur.right, wrong: cur.wrong + 1 };
    return stats;
}

function bandScore(stats, band) {
    const s = (stats || {})[band];
    if (!s) return 0;
    const net = Math.max(0, s.right - s.wrong * 2);
    return Math.min(100, Math.round((net / MASTERY_TARGET) * 100));
}

/* The single figure shown in the statistics, and the one the exam consults
   when deciding how much room to give numbers. */
function numbersKnowledge(profile) {
    const stats = (profile && profile.numberStats) || {};
    const scores = NUM_BANDS.map((b) => bandScore(stats, b.key));
    return Math.round(scores.reduce((a, c) => a + c, 0) / NUM_BANDS.length);
}

/* Which numbers a drill may draw. Kept away from the very large ones for the
   ordering drill, where six long strings would not fit a phone. */
function randomNumber(max) {
    return 1 + Math.floor(Math.random() * max);
}

/* A value drawn from a named band.

   Drawing uniformly from 1-999 looked fair and was not: only ten values in a
   thousand are 1-10, and eight are round hundreds, so almost every question
   was a composed number and every other band sat untouched however long
   anyone practised. Bands are chosen first, values second. */
function valueFromBand(key) {
    if (key === "ones") return 1 + Math.floor(Math.random() * 10);
    if (key === "teens") return 11 + Math.floor(Math.random() * 9);
    if (key === "tens") return (2 + Math.floor(Math.random() * 8)) * 10;
    if (key === "hundreds") return (1 + Math.floor(Math.random() * 9)) * 100;
    /* composed: anything that is not already one of the above */
    let n = 21 + Math.floor(Math.random() * 979);
    if (n % 10 === 0) n += 1;
    return Math.min(999, n);
}

/* The five bands a plain number can belong to; ordinals have a drill of their
   own and are not drawn here. */
const VALUE_BANDS = ["ones", "teens", "tens", "hundreds", "composed"];

/* Weighted towards whatever is least known, so practice goes where it is
   needed — but never so far that a solid band stops appearing at all. */
function bandOrder(profile) {
    const stats = (profile && profile.numberStats) || {};
    return VALUE_BANDS.slice().sort((a, b) => bandScore(stats, a) - bandScore(stats, b));
}

function numberQuestions(count, profile) {
    const order = bandOrder(profile);
    const seen = new Set();
    const out = [];
    let guard = 0;
    while (out.length < count && guard < count * 60) {
        guard++;
        /* Two thirds from the weaker half of the bands, a third from the
           rest: enough to push at the gaps without drilling one band only. */
        const pool = Math.random() < 0.66 ? order.slice(0, 3) : order;
        const band = pool[Math.floor(Math.random() * pool.length)];
        const n = valueFromBand(band);
        if (seen.has(n)) continue;
        seen.add(n);
        out.push(n);
    }
    return out;
}

/* ---------- 1. read the number, type the digits ---------- */
/* Each question carries its value and whether it is asked as a percentage. */
function buildDigitQueue(profile) {
    const values = numberQuestions(NUM_SESSION.digits, profile);
    const wantPct = Math.round(values.length * PERCENT_RATIO);
    const pctSet = new Set(shuffle(values.slice()).slice(0, wantPct));
    return values.map((n) => ({ value: n, percent: pctSet.has(n) }));
}

function NumberDigits({ onBack, onSessionDone, onNumberResult, profile }) {
    const [queue, setQueue] = useState(() => buildDigitQueue(profile));
    const [pos, setPos] = useState(0);
    const [typed, setTyped] = useState("");
    const [result, setResult] = useState(null);
    const [score, setScore] = useState({ correct: 0, total: 0 });
    const [finished, setFinished] = useState(false);
    const timerRef = useRef(null);

    useEffect(() => {
        if (finished && onSessionDone) onSessionDone({ mode: "num-digits", right: score.correct, total: score.total });
        // eslint-disable-next-line react-hooks/exhaustive-deps
    }, [finished]);
    useEffect(() => () => { if (timerRef.current) clearTimeout(timerRef.current); }, []);

    const restart = () => {
        setQueue(buildDigitQueue(profile));
        setPos(0); setTyped(""); setResult(null);
        setScore({ correct: 0, total: 0 }); setFinished(false);
    };

    if (finished) {
        return React.createElement(SessionSummary, {
            title: "סיימת · מספרים ואחוזים",
            total: score.total, right: score.correct, wrong: score.total - score.correct,
            restartLabel: "סבב נוסף", onRestart: restart, onBack: onBack,
        });
    }

    const item = queue[pos];
    const n = item.value;
    const advance = () => {
        if (timerRef.current) clearTimeout(timerRef.current);

/* ---------- 3. the ordinal, in the structure the sentence calls for ----------

   The choice is not only masculine against feminine. Where the counted noun
   carries the article the ordinal follows it and takes the article too —
   אִ(ל)סַיַّארַה (אל)רַאבְּעַה. Where it does not, the ordinal comes first and
   stands in construct — רַאבֶּע סַיַّארַה. Same meaning, different shape, and
   the shape is what this drills. */
/* `gender` is the Arabic gender, which decides the answer. `heGender` is the
   Hebrew one, which decides only how the prompt reads — עַמַארַה is feminine
   in Arabic while בניין is masculine in Hebrew, and a prompt that ignored
   that would read "הבניין התשיעית". */

    { bare: "סַיַ\u0651ארַה", def: "אִ(ל)סַיַ\u0651ארַה", defForm: "(אל)", gender: "f", he: "מכונית", heGender: "f" },
    { bare: "בֵּית", def: "אִ(ל)בֵּית", defForm: "(אל)", gender: "m", he: "בית", heGender: "m" },
    { bare: "וַלַד", def: "אִ(ל)וַלַד", defForm: "(אל)", gender: "m", he: "ילד", heGender: "m" },
    { bare: "עַמַארַה", def: "אִ(ל)עַמַארַה", defForm: "(אל)", gender: "f", he: "עמארה", heGender: "f" },
    { bare: "כְּתַאבּ", def: "אִ(ל)כְּתַאבּ", defForm: "(אל)", gender: "m", he: "ספר", heGender: "m" },
    { bare: "מַדְרַסֶה", def: "אִ(ל)מַדְרַסֶה", defForm: "(אל)", gender: "f", he: "מדרסה", heGender: "f" },
    { bare: "שַקַ\u0651ה", def: "אִ(ל)שַקַ\u0651ה", defForm: "(אל)", gender: "f", he: "דירה", heGender: "f" },
    { bare: "טַאבֶּק", def: "אִ(ל)טַאבֶּק", defForm: "(אל)", gender: "m", he: "קומה", heGender: "f" },
];

function buildOrdinalTask() {
    const noun = ORDINAL_NOUNS[Math.floor(Math.random() * ORDINAL_NOUNS.length)];
    const n = 1 + Math.floor(Math.random() * 10);
    const definite = Math.random() < 0.5;
    const ord = NUM_ORDINALS[n];

    /* The right answer, and three that are each right in some other context:
       the other gender, the plain number, and the form that belongs to the
       opposite structure. */
    const answer = definite ? noun.defForm + ord[noun.gender] : ord[noun.gender];
    const wrong = new Set();
    wrong.add(ord[noun.gender === "m" ? "f" : "m"]);
    wrong.add(spellNumber(n, noun.gender));
    wrong.add(definite ? ord[noun.gender] : noun.defForm + ord[noun.gender]);
    wrong.delete(answer);

    const options = shuffle([answer].concat(Array.from(wrong).slice(0, 3)));
    return {
        noun: noun, n: n, definite: definite, answer: answer, options: options,
        prompt: definite
            ? noun.def + " ___"
            : "___ " + noun.bare,
        /* The Hebrew has to agree too, or the prompt contradicts the
           question: "מכונית הרביעי" asks for something that does not exist. */
        /* Definiteness carries through both words or neither: "מכונית שישית"
           against "המכונית השישית". */
        hebrew: (definite ? "ה" : "") + noun.he + " " + (definite ? "ה" : "") +
            ((noun.heGender || noun.gender) === "f"

                   "שישית", "שביעית", "שמינית", "תשיעית", "עשירית"][n - 1]
                : ["ראשון", "שני", "שלישי", "רביעי", "חמישי",
                   "שישי", "שביעי", "שמיני", "תשיעי", "עשירי"][n - 1]),
    };
}

/* =========================================================================

function normAnswer(text) {
    return String(text || "")
        .replace(/[\u0591-\u05C7\u0610-\u065F]/g, "")   // vowel points and shadda
        /* A phone keyboard is not a typewriter: iOS folds "..." into a single
           ellipsis, quotes come out curly, and the Hebrew geresh has its own
           codepoint. All of them are stripped so a right answer typed on a
           phone is never marked wrong over punctuation. */
        .replace(/[\s()\[\]{}'"\u2018\u2019\u201C\u201D\u05F3\u05F4\u2013\u2014\u2026\u05BE\-,.:;!?\/\\]/g, "")
        .trim();
}

   orthography, not their Arabic. The same for words with an accepted
   synonym in the gloss — נער against בחור. Applied to both the stored
   answer and what was typed, so either spelling matches either way. */

    /* A yod that Hebrew writes once or twice: מדויק and מדוייק are both
       right, and so are the whole family built the same way. */
    ["מדוייקות", "מדויקות"],
    ["מדוייקים", "מדויקים"],
    ["מדוייקת", "מדויקת"],
    ["מדוייק", "מדויק"],
    ["מצוייה", "מצויה"],
    ["מצויינת", "מצוינת"],
    ["מצויינים", "מצוינים"],
    ["מצויין", "מצוין"],
    ["ראוייה", "ראויה"],
    ["שנייה", "שניה"],
    ["רצוייה", "רצויה"],
    ["גלוייה", "גלויה"],
    ["בנוייה", "בנויה"],
    ["עשוייה", "עשויה"],

    ["רישיון", "רשיון"],
    ["עיתונים", "עתונים"],
    ["עיתון", "עתון"],
    ["עניינים", "ענינים"],
    ["מעוניין", "מעונין"],
    ["עניין", "ענין"],
    ["בניינים", "בנינים"],
    ["בניין", "בנין"],
    ["תוכניות", "תכניות"],
    ["תוכנית", "תכנית"],
    ["אוויר", "אויר"],
    ["שינויים", "שנויים"],
    ["שינוי", "שנוי"],
    ["גיליון", "גליון"],
    ["כיוונים", "כוונים"],
    ["כיוון", "כוון"],
    ["זיכרון", "זכרון"],

function spellingVariants(text) {
    let out = [String(text || "")];
    SPELLING_VARIANTS.forEach(([a, b]) => {

            next.push(t);
            if (t.indexOf(a) !== -1) next.push(t.split(a).join(b));
            if (t.indexOf(b) !== -1) next.push(t.split(b).join(a));

   "עד" and "עד ש..." are the same answer; failing one over the other is
   marking orthography, not knowledge. */

    const out = [String(t)];
    const s = String(t).trim();
    if (/\s*ש\.\.\.$/.test(s)) out.push(s.replace(/\s*ש\.\.\.$/, ""));
    else if (s && !/[.\/()]/.test(s)) out.push(s + " ש...");

function acceptableAnswers(text) {
    const out = new Set();
    const add = (t) => {
        subordinatorForms(t).forEach((form) => {
            spellingVariants(form).forEach((v) => {

                if (k) out.add(k);

    add(text);
    const withoutBrackets = String(text || "").replace(/\([^)]*\)/g, " ");
    add(withoutBrackets);
    withoutBrackets.split("/").forEach(add);
    String(text || "").split("/").forEach(add);
    (String(text || "").match(/\(([^)]*)\)/g) || []).forEach((seg) => {
        seg.replace(/[()]/g, "").split("/").forEach(add);
    });
    return out;
}

   sometimes plainly unrelated. Anything that already appears in the answer is
   excluded, otherwise a decoy could be indistinguishable from a tile that is
   genuinely needed.

   sentence gets fewer: the bank is already crowded, and on a phone it would
   otherwise run to several lines. */

    const max = answerLength > 4 ? 2 : 4;
    return 1 + Math.floor(Math.random() * max);

    const reversed = dir === "he2ar";
    const taken = new Set(answerWords);

            if (!word || taken.has(word)) return;
            taken.add(word);
            words.push(word);
        });
    });
    return shuffle(words).slice(0, decoyCount(answerWords.length));

   Two columns of tiles; tap one on each side to join them. The pairs come
   either from the singular/plural links already in the word list, or from the
   masculine/feminine ones. */
function buildPairRounds(deck, kind, count) {
    const byId = new Map(deck.map((d) => [d.id, d]));
    const seen = new Set();
    const rounds = [];
    deck.forEach((item) => {
        if (seen.has(item.id)) return;
        let mate = null;
        if (kind === "gender") {
            mate = item.mate ? byId.get(item.mate) : null;
        } else if (item.form === "יחיד" && item.pair && item.pair.length) {
            mate = byId.get(item.pair[0]);
        }
        if (!mate || seen.has(mate.id)) return;
        seen.add(item.id); seen.add(mate.id);
        /* The left column always holds the same side of the relationship, so
           the exercise is "find its partner" rather than a free-for-all. */
        rounds.push(kind === "gender" && item.gender === "f"
            ? { left: mate, right: item }
            : { left: item, right: mate });

/* Splits a word into what stays in the sentence and what has to be supplied.

   Two things must not travel with the answer into the option list. A definite
   article written as "(א)ל" belongs to the sentence, not to the noun — leaving
   it on the tile both looks wrong and narrows the choice. And a full stop
   marks the end of the sentence, so an option carrying one announces itself as
   the last word. Both stay behind; the option is the bare word. */
function splitBlank(word) {
    let lead = "", tail = "", core = word;
    /* Only a bracketed article is split off. A bare "אל" is not reliably an
       article — it is the start of אלה, and in the transliteration it runs
       into the noun with a vowel of its own (אלְבֵּית), so cutting there
       leaves a fragment rather than a word. */
    const article = core.match(/^(\(א\)ל|\(אל\))/);
    if (article && core.length > article[0].length) {
        lead = article[0];
        core = core.slice(article[0].length);
    }
    const punct = core.match(/[.,!?]+$/);
    if (punct && core.length > punct[0].length) {
        tail = punct[0];
        core = core.slice(0, core.length - punct[0].length);
    }
    return { lead: lead, core: core, tail: tail };
}

/* Which words may be blanked out.

   Never one inside a parenthetical. A bracketed phrase is an aside for the
   reader — "(מצד האב)", "(של) המדינה" — so blanking a word in it offers
   options like "האב)" that are not words at all, and the surviving bracket
   gives the answer away. The aside stays whole and the gap falls on the
   sentence proper.

   A bracketed article is a different thing: there the brackets are part of
   the transliteration of a single word, and splitBlank handles it. */
function blankableIndexes(words) {
    let depth = 0;
    const out = [];
    words.forEach((w, i) => {
        const opensAside = /\((?!א\)|אל\))/.test(w);   // "(" that is not the article
        const inside = depth > 0 || opensAside;
        if (i > 0 && !inside) out.push(i);
        depth += (w.match(/\((?!א\)|אל\))/g) || []).length;
        depth -= (w.match(/\)/g) || []).length - (w.match(/\(א\)|\(אל\)/g) || []).length;
        if (depth < 0) depth = 0;
    });
    return out;
}

function buildBlankTask(deck, item, dir) {
    const reversed = dir === "he2ar";
    const text = reversed ? item.arabic : item.hebrew;
    const words = text.split(" ").filter(Boolean);
    if (words.length < 3) return null;
    const choices = blankableIndexes(words);
    if (choices.length === 0) return null;
    const at = choices[Math.floor(Math.random() * choices.length)];
    const split = splitBlank(words[at]);
    const answer = split.core;
    if (!answer) return null;

    /* Distractors are bare in the same way, or they would give themselves
       away by carrying punctuation the answer does not. */
    const taken = new Set([answer]);
    const options = [];
    shuffle(deck).forEach((other) => {
        if (other._key === item._key || options.length >= 3) return;
        const pool = (reversed ? other.arabic : other.hebrew).split(" ").filter(Boolean);
        const pick = pool[Math.floor(Math.random() * pool.length)];
        if (!pick) return;
        const word = splitBlank(pick).core;
        if (!word || taken.has(word)) return;
        taken.add(word); options.push(word);
    });
    if (options.length < 2) return null;
    return {
        before: words.slice(0, at).concat(split.lead ? [split.lead] : []).join(" ").trim(),
        after: (split.tail + " " + words.slice(at + 1).join(" ")).trim(),
        prompt: reversed ? item.hebrew : item.arabic,
        answer: answer,
        options: shuffle([answer].concat(options)),
    };
}

        while (!built && tries < order.length) {
