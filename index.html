/* =========================================================================
   PROGRESS HELPERS
   Progress balances correct against wrong answers, capped at a "mastery"
   threshold of 6 net-correct points, floored at 0.
   ========================================================================= */
const MASTERY_TARGET = 6;
const netScore = (item) => Math.max(0, (item.correctCount || 0) - 0.5 * (item.wrongCount || 0));
const progressPct = (item) => Math.min(100, Math.round((netScore(item) / MASTERY_TARGET) * 100));
const isMastered = (item) => progressPct(item) >= 100;
const isStruggling = (item) => !isMastered(item) && (item.wrongCount || 0) >= 2 && progressPct(item) < 50;

function withProgressFields(list) {
  return list.map((i) => ({ correctCount: 0, wrongCount: 0, ...i }));
}

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

/* =========================================================================
   PERSISTENCE (window.storage — personal, per-user)
   ========================================================================= */
function usePersistedState(key, initial) {
  const [state, setState] = useState(() => {
    try {
      const raw = window.localStorage.getItem(key);
      return raw ? JSON.parse(raw) : initial;
    } catch (e) {
      return initial;
    }
  });

  useEffect(() => {
    try {
      window.localStorage.setItem(key, JSON.stringify(state));
    } catch (e) {
      /* storage unavailable — ignore */
    }
  }, [key, state]);

  return [state, setState];
}

/* =========================================================================
   FLASHCARD PRACTICE (shared for vocab + letters)
   ========================================================================= */
function FlashcardPractice({ mode, vocab, setVocab, letters, setLetters, onBack }) {
  const data = mode === "vocab" ? vocab : letters;
  const setData = mode === "vocab" ? setVocab : setLetters;
  const [index, setIndex] = useState(0);
  const [flipped, setFlipped] = useState(false);

  useEffect(() => {
    if (index >= data.length) setIndex(0);
  }, [data.length, index]);

  if (data.length === 0) {
    return (
      <div className="zl-anim">
        <BackLink onClick={onBack}>חזרה לשיטות תרגול</BackLink>
        <Card>אין פריטים במאגר עדיין.</Card>
      </div>
    );
  }

  const item = data[index];
  const frontText = mode === "vocab" ? item.front : item.letter;
  const backText = mode === "vocab" ? item.back : item.name;
  const noteText = mode === "vocab" ? item.notes : item.sound;

  const mark = (correct) => {
    setData((prev) =>
      prev.map((d, i) =>
        i === index
          ? { ...d, correctCount: (d.correctCount || 0) + (correct ? 1 : 0), wrongCount: (d.wrongCount || 0) + (correct ? 0 : 1) }
          : d
      )
    );
    setFlipped(false);
    setTimeout(() => setIndex((i) => (i + 1) % data.length), 250);
  };

  const mastered = isMastered(item);
  const struggling = isStruggling(item);
  const faceBg = mastered ? "var(--teal-700)" : struggling ? "var(--clay-bg)" : "var(--sand-100)";
  const faceColor = mastered ? "white" : "var(--ink)";

  return (
    <div className="zl-anim">
      <BackLink onClick={onBack}>חזרה לשיטות תרגול</BackLink>
      <Card>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 6 }}>
          <h2 className="zl-display" style={{ fontSize: "1.15rem", fontWeight: 700 }}>
            תרגול כרטיסיות · {mode === "vocab" ? "אוצר מילים" : "אותיות"}
          </h2>
          <span style={{ fontSize: "0.85rem", color: "var(--ink-muted)" }}>{index + 1} / {data.length}</span>
        </div>

        <div
          onClick={() => setFlipped((f) => !f)}
          style={{
            height: 220,
            margin: "18px 0",
            cursor: "pointer",
            perspective: 1000,
          }}
        >
          <div
            key={item.id + String(flipped)}
            className="zl-anim"
            style={{
              height: "100%",
              borderRadius: 12,
              border: `1px solid ${mastered ? "var(--teal-700)" : struggling ? "var(--clay)" : "var(--sand-200)"}`,
              background: faceBg,
              color: faceColor,
              display: "flex",
              flexDirection: "column",
              alignItems: "center",
              justifyContent: "center",
              textAlign: "center",
              padding: 24,
              boxShadow: "0 4px 14px rgba(15,23,42,0.08)",
            }}
          >
            {!flipped ? (
              <>
                <div className={mode === "letters" ? "zl-arabic" : "zl-display"} style={{ fontSize: mode === "letters" ? "4rem" : "1.9rem", fontWeight: 700, marginBottom: 8 }}>
                  {frontText}
                </div>
                <div style={{ fontSize: "0.8rem", opacity: 0.7 }}>(לחץ להפיכה)</div>
              </>
            ) : (
              <>
                <div className="zl-display" style={{ fontSize: "1.7rem", fontWeight: 700, marginBottom: 6 }}>{backText}</div>
                {noteText ? <div style={{ fontSize: "0.85rem", opacity: 0.8 }}>{noteText}</div> : null}
              </>
            )}
          </div>
        </div>

        <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 14 }}>
          <PrimaryButton variant="outline" onClick={() => { setFlipped(false); setIndex((i) => (i - 1 + data.length) % data.length); }}>קודם</PrimaryButton>
          <PrimaryButton variant="outline" onClick={() => { setFlipped(false); setIndex((i) => (i + 1) % data.length); }}>הבא</PrimaryButton>
        </div>

        <div style={{ display: "flex", justifyContent: "center", gap: 12 }}>
          <PrimaryButton variant="danger" onClick={() => mark(false)}><X size={16}/>לא ידעתי</PrimaryButton>
          <PrimaryButton variant="success" onClick={() => mark(true)}><Check size={16}/>ידעתי</PrimaryButton>
        </div>
        <p style={{ textAlign: "center", fontSize: "0.8rem", color: "var(--ink-muted)", marginTop: 12 }}>
          הצלחות: {item.correctCount || 0} | כשלונות: {item.wrongCount || 0}
        </p>
      </Card>
    </div>
  );
}

/* =========================================================================
   AMERICAN QUIZ (multiple choice, shared for vocab + letters)
   ========================================================================= */
function buildQuestion(data, item, mode) {
  const correctAnswer = mode === "vocab" ? item.back : item.name;
  const pool = data.filter((d) => d.id !== item.id);
  const distractors = shuffle(pool).slice(0, 3).map((d) => (mode === "vocab" ? d.back : d.name));
  const options = shuffle([correctAnswer, ...distractors]);
  return { prompt: mode === "vocab" ? item.front : item.letter, options, correctAnswer };
}

function AmericanQuiz({ mode, vocab, setVocab, letters, setLetters, onBack }) {
  const data = mode === "vocab" ? vocab : letters;
  const setData = mode === "vocab" ? setVocab : setLetters;
  const [order, setOrder] = useState(() => shuffle(data.map((_, i) => i)));
  const [pos, setPos] = useState(0);
  const [question, setQuestion] = useState(null);
  const [selected, setSelected] = useState(null);
  const [score, setScore] = useState({ correct: 0, total: 0 });

  useEffect(() => {
    if (data.length === 0) return;
    const item = data[order[pos % order.length]];
    setQuestion(buildQuestion(data, item, mode));
    setSelected(null);
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [pos, data.length]);

  if (data.length < 4) {
    return (
      <div className="zl-anim">
        <BackLink onClick={onBack}>חזרה לשיטות תרגול</BackLink>
        <Card>צריך לפחות 4 פריטים במאגר כדי להריץ מבחן אמריקאי.</Card>
      </div>
    );
  }
  if (!question) return null;

  const currentItem = data[order[pos % order.length]];

  const choose = (opt) => {
    if (selected) return;
    setSelected(opt);
    const correct = opt === question.correctAnswer;
    setScore((s) => ({ correct: s.correct + (correct ? 1 : 0), total: s.total + 1 }));
    setData((prev) =>
      prev.map((d) =>
        d.id === currentItem.id
          ? { ...d, correctCount: (d.correctCount || 0) + (correct ? 1 : 0), wrongCount: (d.wrongCount || 0) + (correct ? 0 : 1) }
          : d
      )
    );
    setTimeout(() => setPos((p) => p + 1), 700);
  };

  return (
    <div className="zl-anim">
      <BackLink onClick={onBack}>חזרה לשיטות תרגול</BackLink>
      <Card>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 16 }}>
          <h2 className="zl-display" style={{ fontSize: "1.15rem", fontWeight: 700 }}>
            מבחן אמריקאי · {mode === "vocab" ? "אוצר מילים" : "אותיות"}
          </h2>
          <span style={{ fontSize: "0.85rem", color: "var(--ink-muted)" }}>{score.correct} / {score.total}</span>
        </div>

        <div
          className={mode === "letters" ? "zl-arabic" : "zl-display"}
          style={{
            textAlign: "center",
            fontSize: mode === "letters" ? "3.5rem" : "1.8rem",
            fontWeight: 700,
            padding: "28px 12px",
            background: "var(--sand)",
            borderRadius: 12,
            marginBottom: 18,
            border: "1px solid var(--sand-200)",
          }}
        >
          {question.prompt}
        </div>

        <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10 }}>
          {question.options.map((opt) => {
            const isCorrect = opt === question.correctAnswer;
            const isChosen = opt === selected;
            let bg = "var(--sand-100)", border = "var(--sand-200)", color = "var(--ink)";
            if (selected) {
              if (isCorrect) { bg = "var(--teal-700)"; border = "var(--teal-700)"; color = "white"; }
              else if (isChosen) { bg = "var(--clay)"; border = "var(--clay)"; color = "white"; }
            }
            return (
              <button
                key={opt}
                onClick={() => choose(opt)}
                disabled={!!selected}
                style={{
                  padding: "14px 10px",
                  borderRadius: 10,
                  border: `1px solid ${border}`,
                  background: bg,
                  color,
                  fontWeight: 600,
                  fontSize: "0.95rem",
                  cursor: selected ? "default" : "pointer",
                }}
              >
                {opt}
              </button>
            );
          })}
        </div>
      </Card>
    </div>
  );
}

/* =========================================================================
   SENTENCE BUILDER GAME
   ========================================================================= */
function SentenceBuilder() {
  const [idx, setIdx] = useState(0);
  const [bank, setBank] = useState([]);
  const [built, setBuilt] = useState([]);
  const [result, setResult] = useState(null);

  const sentence = SENTENCES[idx % SENTENCES.length];
  const answerWords = useMemo(() => sentence.arabic.split(" "), [sentence]);

  useEffect(() => {
    setBank(shuffle(answerWords.map((w, i) => ({ w, key: i }))));
    setBuilt([]);
    setResult(null);
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [idx]);

  const pick = (tile) => {
    setBank((b) => b.filter((t) => t.key !== tile.key));
    setBuilt((b) => [...b, tile]);
  };
  const unpick = (tile) => {
    setBuilt((b) => b.filter((t) => t.key !== tile.key));
    setBank((b) => [...b, tile]);
  };
  const check = () => {
    const guess = built.map((t) => t.w).join(" ");
    setResult(guess === sentence.arabic ? "correct" : "wrong");
  };
  const next = () => setIdx((i) => i + 1);

  return (
    <Card>
      <h3 className="zl-display" style={{ fontWeight: 700, marginBottom: 6 }}>הרכבת משפטים</h3>
      <p style={{ color: "var(--ink-muted)", fontSize: "0.85rem", marginBottom: 14 }}>
        סדר את המילים כך שיתקבל המשפט הבא בערבית (בתעתיק):
      </p>
      <div style={{ background: "var(--sand)", borderRadius: 10, padding: "14px 16px", marginBottom: 16, fontWeight: 700 }}>
        {sentence.hebrew}
      </div>

      <div style={{ minHeight: 54, border: "1px dashed var(--sand-200)", borderRadius: 10, padding: 10, display: "flex", flexWrap: "wrap", gap: 8, marginBottom: 14 }}>
        {built.length === 0 && <span style={{ color: "var(--ink-muted)", fontSize: "0.85rem" }}>לחץ על המילים למטה כדי לבנות את המשפט</span>}
        {built.map((t) => (
          <button key={t.key} onClick={() => unpick(t)} style={{ background: "var(--teal-950)", color: "white", border: "none", borderRadius: 8, padding: "6px 12px", cursor: "pointer" }}>
            {t.w}
          </button>
        ))}
      </div>

      <div style={{ display: "flex", flexWrap: "wrap", gap: 8, marginBottom: 16 }}>
        {bank.map((t) => (
          <button key={t.key} onClick={() => pick(t)} style={{ background: "var(--sand-100)", border: "1px solid var(--sand-200)", borderRadius: 8, padding: "6px 12px", cursor: "pointer" }}>
            {t.w}
          </button>
        ))}
      </div>

      {result === "correct" && <p style={{ color: "var(--teal-700)", fontWeight: 700, marginBottom: 10 }}>נכון מאוד! 🎉</p>}
      {result === "wrong" && <p style={{ color: "var(--clay)", fontWeight: 700, marginBottom: 10 }}>לא בדיוק — התשובה הנכונה: {sentence.arabic}</p>}

      <div style={{ display: "flex", gap: 10 }}>
        <PrimaryButton variant="outline" onClick={() => { setBank(shuffle(answerWords.map((w, i) => ({ w, key: i })))); setBuilt([]); setResult(null); }}>
          <RotateCcw size={15} />איפוס
        </PrimaryButton>
        {result ? (
          <PrimaryButton variant="gold" onClick={next}>המשפט הבא</PrimaryButton>
        ) : (
          <PrimaryButton onClick={check} disabled={bank.length > 0}>בדוק</PrimaryButton>
        )}
      </div>
    </Card>
  );
}

              border: `1px solid ${sub === t.id ? "var(--teal-950)" : "var(--sand-200)"}`,
              background: sub === t.id ? "var(--teal-950)" : "white",
              color: sub === t.id ? "white" : "var(--ink)",
              cursor: "pointer",
              fontSize: "0.85rem",
              fontWeight: 600,
            }}
          >
            {t.label}
          </button>
        ))}
      </div>

      {sub === "builder" && <SentenceBuilder />}
      {sub === "reading" && (
        <Card>
          <RevealList
            items={SENTENCES}
            renderTop={(it) => it.arabic}
            renderBottom={(it) => it.hebrew}
            emptyLabel="אין משפטים להצגה"
          />
        </Card>
      )}
      {sub === "idioms" && (
        <Card>
          <RevealList
            items={IDIOMS}
            renderTop={(it) => it.arabic}
            renderBottom={(it) => (
              <>
                <div>פירוש מילולי: {it.literal}</div>
                <div style={{ marginTop: 2, fontWeight: 600, color: "var(--ink)" }}>משמעות: {it.meaning}</div>
              </>
            )}
            emptyLabel="אין ניבים להצגה"
          />
        </Card>
      )}
    </div>
  );
}

/* =========================================================================
   PRACTICE HUB TAB
   ========================================================================= */
function PracticeTab({ screen, setScreen, vocab, setVocab, letters, setLetters }) {
  const [sub, setSub] = useState("flashcards");

  if (screen?.screen === "flashcards") {
    return (
      <FlashcardPractice
        mode={screen.mode}
        vocab={vocab} setVocab={setVocab}
        letters={letters} setLetters={setLetters}
        onBack={() => setScreen(null)}
      />
    );
  }
  if (screen?.screen === "quiz") {
    return (
      <AmericanQuiz
        mode={screen.mode}
        vocab={vocab} setVocab={setVocab}
        letters={letters} setLetters={setLetters}
        onBack={() => setScreen(null)}
      />
    );
  }
  if (screen?.screen === "sentence-builder" || screen?.screen === "reading") {
    return (
      <div className="zl-anim">
        <BackLink onClick={() => setScreen(null)}>חזרה לשיטות תרגול</BackLink>
        <SectionHeader title="תרגול משפטים וקריאה" />
        <SentencesReadingHub />
      </div>
    );
  }

  const subTabs = [
    { id: "flashcards", label: "כרטיסיות" },
    { id: "quiz", label: "מבחן אמריקאי" },
    { id: "sentences", label: "משפטים וקריאה" },
  ];

  return (
    <div className="zl-anim">
      <SectionHeader title="שיטות תרגול" subtitle="בחר את שיטת האימון הרצויה כדי להתחיל" />

      <div style={{ display: "flex", gap: 8, marginBottom: 18, flexWrap: "wrap" }}>
        {subTabs.map((t) => (
          <button
            key={t.id}
            onClick={() => setSub(t.id)}
            style={{
              padding: "8px 18px",
              borderRadius: 20,
              border: `1px solid ${sub === t.id ? "var(--teal-950)" : "var(--sand-200)"}`,
              background: sub === t.id ? "var(--teal-950)" : "white",
              color: sub === t.id ? "white" : "var(--ink)",
              cursor: "pointer",
              fontSize: "0.88rem",
              fontWeight: 600,
            }}
          >
            {t.label}
          </button>
        ))}
      </div>

      {sub === "flashcards" && (
        <>
          <PracticeCard title="תרגול אוצר מילים" desc="שליפה פעילה של מילים בכרטיסיות." onClick={() => setScreen({ screen: "flashcards", mode: "vocab" })} />
          <PracticeCard title="תרגול אותיות" desc="היכרות וזיהוי מהיר של אותיות האלף-בית." onClick={() => setScreen({ screen: "flashcards", mode: "letters" })} />
        </>
      )}
      {sub === "quiz" && (
        <>
          <PracticeCard title="מבחן אמריקאי · אוצר מילים" desc="בחירה מתוך 4 אפשרויות תרגום." onClick={() => setScreen({ screen: "quiz", mode: "vocab" })} />
          <PracticeCard title="מבחן אמריקאי · אותיות" desc="בחירה מתוך 4 אפשרויות שם/הגייה." onClick={() => setScreen({ screen: "quiz", mode: "letters" })} />
        </>
      )}
      {sub === "sentences" && <SentencesReadingHub />}
    </div>
  );
}

function PracticeCard({ title, desc, onClick }) {
  return (
    <Card style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 12 }}>
      <div>
        <h3 style={{ fontSize: "1rem", fontWeight: 700, marginBottom: 4 }}>{title}</h3>
        <p style={{ fontSize: "0.85rem", color: "var(--ink-muted)" }}>{desc}</p>
      </div>
      <ArrowButton onClick={onClick} title={title} />
    </Card>
  );
}

/* =========================================================================
   VOCAB TAB
   ========================================================================= */
function VocabTab({ vocab, setVocab }) {
  const [modalOpen, setModalOpen] = useState(false);
  const [form, setForm] = useState({ front: "", back: "", notes: "" });

  const addWord = (e) => {
    e.preventDefault();
    if (!form.front.trim() || !form.back.trim()) return;
    setVocab((prev) => [
      ...prev,
      { id: Date.now(), front: form.front.trim(), back: form.back.trim(), notes: form.notes.trim(), correctCount: 0, wrongCount: 0 },
    ]);
    setForm({ front: "", back: "", notes: "" });
    setModalOpen(false);
  };

  return (
    <div className="zl-anim">
      <SectionHeader title="חומת אוצר המילים" subtitle="לחץ על ריבוע ההוספה כדי לחבר מילה חדשה למאגר" />
      <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill, minmax(135px, 1fr))", gap: 10 }}>
        <button
          onClick={() => setModalOpen(true)}
          style={{
            border: "2px dashed var(--gold)",
            borderRadius: 10,
            background: "var(--sand-100)",
            color: "var(--teal-950)",
            minHeight: 100,
            display: "flex",
            flexDirection: "column",
            alignItems: "center",
            justifyContent: "center",
            gap: 6,
            cursor: "pointer",
          }}
        >
          <Plus size={22} />
          <span style={{ fontSize: "0.8rem", fontWeight: 700 }}>הוסף מילה</span>
        </button>

        {vocab.map((item) => {
          const pct = progressPct(item);
          const mastered = isMastered(item);
          const struggling = isStruggling(item);
          return (
            <div
              key={item.id}
              style={{
                background: mastered ? "var(--teal-700)" : struggling ? "var(--clay-bg)" : "var(--sand-100)",
                color: mastered ? "white" : "var(--ink)",
                border: `1px solid ${mastered ? "var(--teal-700)" : struggling ? "var(--clay)" : "var(--sand-200)"}`,
                borderRadius: 10,
                padding: 12,
                minHeight: 100,
                display: "flex",
                flexDirection: "column",
                justifyContent: "space-between",
              }}
            >
              <div>
                <div style={{ fontWeight: 700, fontSize: "1rem" }}>{item.front}</div>
                <div style={{ fontSize: "0.78rem", opacity: 0.8, marginTop: 2 }}>{item.back}</div>
              </div>
              <div style={{ marginTop: 8 }} title={`התקדמות: ${pct}%`}>
                <ProgressBar pct={pct} mastered={mastered} struggling={struggling} />
              </div>
            </div>
          );
        })}
      </div>

      {modalOpen && (
        <div
          onClick={() => setModalOpen(false)}
          style={{ position: "fixed", inset: 0, background: "rgba(15,23,42,0.45)", display: "flex", alignItems: "center", justifyContent: "center", padding: 16, zIndex: 1000 }}
        >
          <div onClick={(e) => e.stopPropagation()} style={{ background: "white", borderRadius: 14, padding: 22, width: "100%", maxWidth: 420 }}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 16 }}>
              <h3 className="zl-display" style={{ fontWeight: 700, color: "var(--teal-950)" }}>הוספת מילה חדשה</h3>
              <button onClick={() => setModalOpen(false)} style={{ background: "none", border: "none", cursor: "pointer" }}><X size={18} /></button>
            </div>
            <form onSubmit={addWord}>
              <FormField label="תעתיק עברי-ערבי" value={form.front} onChange={(v) => setForm((f) => ({ ...f, front: v }))} placeholder="למשל: כִּתַאבּ" required />
              <FormField label="תרגום" value={form.back} onChange={(v) => setForm((f) => ({ ...f, back: v }))} placeholder="למשל: ספר" required />
              <FormField label="הערות (רשות)" value={form.notes} onChange={(v) => setForm((f) => ({ ...f, notes: v }))} placeholder="למשל: ר' כֻּתֻבּ" />
              <div style={{ display: "flex", gap: 8, justifyContent: "flex-end", marginTop: 16 }}>
                <PrimaryButton variant="outline" onClick={() => setModalOpen(false)}>ביטול</PrimaryButton>
                <PrimaryButton onClick={addWord}>הוסף למאגר</PrimaryButton>
              </div>
            </form>
          </div>
        </div>
      )}
    </div>
  );
}

const FormField = ({ label, value, onChange, placeholder, required }) => (
  <div style={{ marginBottom: 12 }}>
    <label style={{ display: "block", fontSize: "0.8rem", fontWeight: 700, marginBottom: 4 }}>{label}</label>
    <input
      value={value}
      required={required}
      onChange={(e) => onChange(e.target.value)}
      placeholder={placeholder}
      style={{ width: "100%", padding: "9px 12px", border: "1px solid var(--sand-200)", borderRadius: 8, fontSize: "0.9rem", outline: "none" }}
    />
  </div>
);

/* =========================================================================
   ALPHABET TAB
   ========================================================================= */
function AlphabetTab({ letters }) {
  return (
    <div className="zl-anim">
      <SectionHeader title="אותיות האלף-בית והגייתן" subtitle="סקור את האותיות; ההתקדמות מוזנת מכרטיסיות ומהמבחן האמריקאי" />
      <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill, minmax(115px, 1fr))", gap: 10 }}>
        {letters.map((item) => {
          const pct = progressPct(item);
          const mastered = isMastered(item);
          const struggling = isStruggling(item);
          return (
            <div
              key={item.id}
              style={{
                background: mastered ? "var(--teal-700)" : struggling ? "var(--clay-bg)" : "var(--sand-100)",
                color: mastered ? "white" : "var(--ink)",
                border: `1px solid ${mastered ? "var(--teal-700)" : struggling ? "var(--clay)" : "var(--sand-200)"}`,
                borderRadius: 10,
                padding: 14,
                textAlign: "center",
              }}
            >
              <div className="zl-arabic" style={{ fontSize: "1.9rem", fontWeight: 700, marginBottom: 4 }}>{item.letter}</div>
              <div style={{ fontSize: "0.85rem", fontWeight: 600 }}>{item.name}</div>
              <div style={{ fontSize: "0.72rem", opacity: 0.75, marginTop: 2, marginBottom: 8 }}>{item.sound}</div>
              <ProgressBar pct={pct} mastered={mastered} struggling={struggling} />
            </div>
          );
        })}
      </div>
    </div>
  );
}

/* =========================================================================
   ROOT APP
   ========================================================================= */
function ArabicLearningApp() {
  const [tab, setTab] = useState("routine");
  const [practiceScreen, setPracticeScreen] = useState(null);

  const [vocab, setVocab] = usePersistedState("vocab-data", withProgressFields(DEFAULT_VOCAB));
  const [letters, setLetters] = usePersistedState("letters-data", withProgressFields(ALPHABET));
  const [checklist, setChecklist] = usePersistedState("routine-checklist", {});

  const navigateFromRoutine = (target) => {
    setTab("practice");
    setPracticeScreen(target);
  };

  return (
    <div className="zl-root" style={{ padding: "20px 14px 60px" }}>
      <GlobalStyle />
      <div style={{ maxWidth: 880, margin: "0 auto" }}>
        <header style={{ marginBottom: 24, borderBottom: "1px solid var(--sand-200)", paddingBottom: 16 }}>
          <h1 className="zl-display" style={{ fontSize: "1.5rem", fontWeight: 700, color: "var(--teal-950)", letterSpacing: "-0.02em" }}>
            לומדים ערבית
          </h1>
          <p style={{ color: "var(--ink-muted)", fontSize: "0.9rem", marginTop: 2 }}>
            שליפה פעילה, קלט מובן ומעקב התקדמות
          </p>
        </header>

        <TopNav
          active={tab}
          onChange={(t) => {
            setTab(t);
            if (t !== "practice") setPracticeScreen(null);
          }}
        />

        {tab === "routine" && (
          <RoutineTab checklist={checklist} setChecklist={setChecklist} navigateTo={navigateFromRoutine} />
        )}
        {tab === "practice" && (
          <PracticeTab
            screen={practiceScreen}
            setScreen={setPracticeScreen}
            vocab={vocab} setVocab={setVocab}
            letters={letters} setLetters={setLetters}
          />
        )}
        {tab === "vocab" && <VocabTab vocab={vocab} setVocab={setVocab} />}
        {tab === "alphabet" && <AlphabetTab letters={letters} />}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<ArabicLearningApp />);
</script>
</body>
</html>
